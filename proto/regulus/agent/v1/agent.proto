syntax = "proto3";

// Contract between agents and the hub.
//
// An agent opens one long-lived bidirectional stream (Connect) towards the
// hub. The built-in agent of the hub uses exactly the same contract through
// an in-process transport, so remote agents need no separate protocol.
//
// Compatibility rules (docs/versioning.md): fields are only added, never
// renumbered, retyped or reused (CI runs `buf breaking`); a change in meaning
// that an older peer cannot follow bumps protocol_version and is negotiated in
// the Hello/Welcome exchange.
//
// The update contract is the part that never changes its meaning, in any
// protocol version, because it is what brings an old agent up to date: Hello,
// Welcome, Reject, Heartbeat, Command with ApplyUpdate (and Ping),
// CommandResult, and FetchUpdate with its messages. A hub speaks it to every
// agent that was ever released (see Welcome.update_only).
package regulus.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
  // Connect is the only RPC: a persistent stream carrying everything that
  // flows between an agent and its hub.
  //
  // Flow: the agent sends Hello; the hub answers Welcome or Reject (and ends
  // the stream on Reject). After Welcome the agent sends Heartbeat and
  // MetricsReport messages on the intervals set by the hub, and the hub may
  // send Command messages at any time; each Command is answered by a
  // CommandResult.
  rpc Connect(stream AgentMessage) returns (stream HubMessage);

  // FetchUpdate streams one file of the release the hub offers in an
  // ApplyUpdate command, over the same mTLS connection. The hub serves only
  // the release it runs itself, and the archive of the caller's platform.
  rpc FetchUpdate(FetchUpdateRequest) returns (stream FileChunk);
}

// Messages sent by the agent.
message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    MetricsReport metrics = 3;
    CommandResult command_result = 4;
  }
}

// Messages sent by the hub.
message HubMessage {
  oneof payload {
    Welcome welcome = 1;
    Reject reject = 2;
    Command command = 3;
  }
}

// Hello is the first message of every stream: it registers the agent.
message Hello {
  // Highest protocol version the agent speaks (see internal/protocol).
  uint32 protocol_version = 1;
  // Release version of the agent, for display and update decisions.
  string agent_version = 2;
  // Stable identifier of the agent. Empty on the very first connection, when
  // the hub assigns one in Welcome.
  string agent_id = 3;
  SystemInfo system = 4;
  // Lowest protocol version the agent still speaks. Zero (an agent that
  // predates this field) means it speaks only protocol_version. The hub picks
  // the highest version both sides speak.
  uint32 min_protocol_version = 5;
  // The last outcome the update helper wrote on the agent (result.json), so a
  // rollout judges a server by what the helper did and not only by versions
  // and time (#337). Absent when the agent has no helper, or none ran.
  // Added in protocol 1 without a new version (add-only, docs/versioning.md):
  // an older hub ignores it, an older agent does not send it and the hub then
  // falls back to the rule by versions and time.
  UpdateResult update_result = 6;
}

// UpdateResult is the outcome the root update helper recorded on an agent.
// It mirrors result.json of the helper (internal/update.ApplyResult); like
// that file it is only ever extended.
message UpdateResult {
  // The version the helper tried to install.
  string version = 1;
  // The version it replaced.
  string from = 2;
  // "installing", "applied", "rolled_back" or "failed".
  string outcome = 3;
  // What the helper says, in English.
  string message = 4;
  // A stable code and its arguments for a translation of message (#368); both
  // are empty when the helper wrote none.
  string code = 5;
  map<string, string> args = 6;
  // When the helper wrote it, by the agent's clock.
  google.protobuf.Timestamp at = 7;
}

// SystemInfo describes the machine the agent runs on. It rarely changes.
message SystemInfo {
  string hostname = 1;
  string os = 2;          // for example "linux"
  string os_version = 3;  // for example "Ubuntu 24.04.1 LTS"
  string kernel = 4;
  string arch = 5;        // for example "amd64", "arm64"
  uint32 cpu_count = 6;
  uint64 memory_total_bytes = 7;
  // The container the agent runs in, when it can tell: "docker", "podman",
  // "lxc", "systemd-nspawn" or another name systemd gives; empty on a machine
  // of its own (or when it cannot tell). In a container the CPU and memory
  // figures read from /proc may be the host's (docs/remote-agents.md).
  // Added in protocol 1 without a new version: an older hub ignores it.
  string container = 8;
}

// Welcome accepts the agent and configures the stream.
message Welcome {
  // Protocol version negotiated for this stream.
  uint32 protocol_version = 1;
  string hub_version = 2;
  // Identifier of the agent; equals Hello.agent_id when it was provided.
  string agent_id = 3;
  // How often the agent must send a Heartbeat.
  google.protobuf.Duration heartbeat_interval = 4;
  // How often the agent must send a MetricsReport.
  google.protobuf.Duration metrics_interval = 5;
  // The agent is too old for this hub (its release, or the protocol versions
  // it speaks) and was admitted only to be updated: the hub sends ApplyUpdate
  // and Ping and nothing else, and ignores everything the agent sends but
  // heartbeats and command results. An agent that knows this field stops
  // collecting metrics; an older one ignores it and its reports are dropped.
  bool update_only = 6;
  // Why, for the agent's log. Set with update_only.
  string notice = 7;
}

// Reject refuses the agent; the hub closes the stream right after.
message Reject {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNSUPPORTED_PROTOCOL_VERSION = 1;
    REASON_UNAUTHORIZED = 2;
    // The protocol would work but the release of the agent is further behind
    // the hub than the hub supports (the current and the previous release
    // series are accepted). Update the agent.
    REASON_AGENT_TOO_OLD = 3;
  }
  Reason reason = 1;
  // Human readable explanation, safe to show in the dashboard.
  string message = 2;
  // Protocol versions the hub accepts, to help the operator upgrade.
  uint32 min_protocol_version = 3;
  uint32 max_protocol_version = 4;
}

// Heartbeat tells the hub the agent is alive.
message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
  // The update helper's result, sent when it differs from the one the hub
  // already has (the one in Hello, or the last heartbeat). A helper that
  // refuses a request ("failed") changes nothing and does not restart the
  // agent, so no new Hello arrives: this is how the hub learns of it (#411).
  // Added without a new version (add-only, docs/versioning.md); an older hub
  // ignores it and an older agent does not send it.
  UpdateResult update_result = 2;
}

// MetricsReport is a snapshot of the machine state.
message MetricsReport {
  google.protobuf.Timestamp collected_at = 1;
  CpuMetrics cpu = 2;
  MemoryMetrics memory = 3;
  repeated DiskMetrics disks = 4;
  repeated NetworkMetrics networks = 5;
  uint64 uptime_seconds = 6;
  // The plugins the agent runs (docs/plugins/runtime.md), sent with every
  // report. plugins_enabled is false when the agent has no plugins directory;
  // an agent older than this field sends neither, which reads the same.
  // Added in protocol 1 without a new version: an older hub ignores them.
  repeated PluginStatus plugins = 7;
  bool plugins_enabled = 8;
  // Which collector made the report: "linux" (everything from /proc and
  // statfs) or "basic" (a system without /proc: time and uptime only). Empty
  // from an agent older than this field.
  string collector = 9;
  // The parts of the report the agent could not read on this system, so that
  // the dashboard says so instead of showing zeros or an empty widget: any of
  // "cpu", "load", "memory", "disks", "network", "uptime". A hub shows a value
  // it does not know as it is. Empty when everything was read, and from an
  // agent older than this field. Added in protocol 1 without a new version.
  repeated string unavailable = 10;
  // The physical disks of the machine with what each drive reports about
  // itself (#148), so the hub can follow a disk from server to server. They
  // are raw identifiers: the hub decides which one is the identity key
  // (docs/disks.md). disk_identity_version is the version of this part, 1 for
  // the fields of PhysicalDisk below; 0 (and no disks) from an agent older than
  // this field, or on a system where the agent could not read any. Added in
  // protocol 1 without a new version: an older hub ignores both.
  uint32 disk_identity_version = 11;
  repeated PhysicalDisk physical_disks = 12;
}

// PhysicalDisk is one drive as the machine reports it. Everything is read
// from the system (sysfs, udev) without privileges; a field the drive does not
// report is empty, never guessed.
message PhysicalDisk {
  // The kernel name, for example "sda" or "nvme0n1". It identifies the disk
  // on this server only and changes when the disk is moved or the machine
  // restarts: never an identity, shown only to say where the disk is now.
  string device = 1;
  string vendor = 2;
  string model = 3;
  string serial = 4;
  // The world-wide identifier of the drive: a WWN (SATA, SAS) or an EUI-64 or
  // NGUID (NVMe), as lowercase hexadecimal without separators or prefix.
  string wwn = 5;
  // What wwn is: "wwn", "eui64" or "nguid"; empty when wwn is empty.
  string wwn_kind = 6;
  uint64 size_bytes = 7;
  // "sata", "sas", "nvme", "usb", "virtio", "scsi" or empty when unknown.
  string transport = 8;
  // The system says the disk is a virtual one (a hypervisor's disk). Such a
  // disk usually has a made-up or missing serial.
  bool virtual = 9;
}

// PluginStatus is the state of one plugin as the agent's supervisor sees it.
message PluginStatus {
  string id = 1;
  string version = 2;
  // One of starting, running, restarting, failed, incompatible, stopped,
  // invalid (a directory that is not a usable plugin: id is the directory
  // name, version is empty, last_error says why). A hub shows a value it
  // does not know as it is.
  string state = 3;
  // How many times it was started again since the agent started.
  uint32 restarts = 4;
  // Why it last stopped, failed or cannot run; empty while it runs.
  string last_error = 5;
  // When it entered this state.
  google.protobuf.Timestamp since = 6;
}

message CpuMetrics {
  // Utilisation over the last interval, 0 to 100, across all cores.
  double usage_percent = 1;
  double load_1 = 2;
  double load_5 = 3;
  double load_15 = 4;
}

message MemoryMetrics {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 available_bytes = 3;
  uint64 swap_total_bytes = 4;
  uint64 swap_used_bytes = 5;
}

message DiskMetrics {
  string mount_point = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
}

message NetworkMetrics {
  string interface = 1;
  // Monotonic counters since boot; the hub computes rates.
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
}

// Command is an instruction from the hub. Plugins will add their own command
// kinds in a later version of the contract.
message Command {
  // Unique per stream; echoed back in CommandResult.
  string id = 1;
  oneof kind {
    Ping ping = 2;
    SetIntervals set_intervals = 3;
    ApplyUpdate apply_update = 4;
  }
}

// Ping asks the agent to answer with a successful CommandResult.
message Ping {}

// SetIntervals changes the reporting intervals. A zero value keeps the
// current one.
message SetIntervals {
  google.protobuf.Duration heartbeat_interval = 1;
  google.protobuf.Duration metrics_interval = 2;
}

// CommandResult is the agent's answer to a Command.
message CommandResult {
  string command_id = 1;
  bool success = 2;
  // Set when success is false.
  string error = 3;
}

// ApplyUpdate offers the agent a new release. The agent downloads the files
// with FetchUpdate, checks them, and asks the helper of its server (which runs
// as root) to install them; the result is sent once the files are handed over,
// and the restarted agent proves the update by connecting with the new version.
// An agent that predates this command answers "unsupported command".
message ApplyUpdate {
  // Version to install, for example "0.2.0"; the tag is "v" + version.
  string version = 1;
  // Name of the archive for the agent's platform.
  string archive = 2;
  // SHA-256 of the archive, lower-case hex, as listed in the signed
  // checksums.txt.
  string sha256 = 3;
  uint64 size = 4;
}

// Files of a release that FetchUpdate serves.
enum UpdateFile {
  UPDATE_FILE_UNSPECIFIED = 0;
  // The archive of the caller's platform.
  UPDATE_FILE_ARCHIVE = 1;
  // checksums.txt, which the release workflow signed.
  UPDATE_FILE_CHECKSUMS = 2;
  // checksums.txt.sigstore.json, the Sigstore bundle of that signature.
  UPDATE_FILE_BUNDLE = 3;
}

message FetchUpdateRequest {
  string version = 1;
  UpdateFile file = 2;
}

message FileChunk {
  bytes data = 1;
}
