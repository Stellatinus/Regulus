<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regulus Network v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Prototype for #282 (open ports) and #283 (traffic map), in the machine-room v2 language:
   concrete and graphite, one safety-yellow signal for the hub and primary actions, Archivo + IBM Plex Mono.
   Example data only; design in docs/network-visibility.md. */
:root{
  --bg:#e6e8e3;--surface:#f5f6f2;--surface-2:#eceee9;--ink:#14171a;--muted:#5c635e;--faint:#8a918b;--line:#d0d4cc;--line-2:#b9beb5;
  --signal:#ffcc12;--signal-ink:#1c1600;--ok:#17914c;--warn:#c77d00;--crit:#d22d47;--info:#2f56e8;--off:#8c928d;
  --floor:#dcdfd8;--floor-line:#c7cbc2;--zone:#d2d6ce;--metal-top:#4a5156;--metal-l:#2d3236;--metal-r:#22262a;--metal-edge:#5f676d;
  --k-agent:#2f56e8;--k-update:#7a3fd0;--k-repl:#0f8a8a;--k-plugin:#b5487e;--k-other:#6b5a3e;--k-vpn:#4c7a2a;
  --scrim:rgba(20,23,26,.35);
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1112;--surface:#171a1c;--surface-2:#1d2123;--ink:#eef0ec;--muted:#9aa29c;--faint:#6b726d;--line:#2a2f31;--line-2:#3a4043;
  --signal:#ffd23a;--ok:#3fd47f;--warn:#ffb020;--crit:#ff5a6e;--info:#7c97ff;--off:#69706b;
  --floor:#15181a;--floor-line:#23282a;--zone:#1b1f21;--metal-top:#545c62;--metal-l:#353b40;--metal-r:#2a2f33;--metal-edge:#6c757b;
  --k-agent:#7c97ff;--k-update:#b48cff;--k-repl:#3cc9c9;--k-plugin:#f07cb4;--k-other:#c9ad7c;--k-vpn:#8fcf5e;--scrim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1112;--surface:#171a1c;--surface-2:#1d2123;--ink:#eef0ec;--muted:#9aa29c;--faint:#6b726d;--line:#2a2f31;--line-2:#3a4043;
  --signal:#ffd23a;--ok:#3fd47f;--warn:#ffb020;--crit:#ff5a6e;--info:#7c97ff;--off:#69706b;
  --floor:#15181a;--floor-line:#23282a;--zone:#1b1f21;--metal-top:#545c62;--metal-l:#353b40;--metal-r:#2a2f33;--metal-edge:#6c757b;
  --k-agent:#7c97ff;--k-update:#b48cff;--k-repl:#3cc9c9;--k-plugin:#f07cb4;--k-other:#c9ad7c;--k-vpn:#8fcf5e;--scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:14px;line-height:1.45;overflow:hidden;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);grid-template-areas:"side head" "side main";gap:10px}
/* sidebar */
.side{grid-area:side;display:flex;flex-direction:column;background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 10px;min-height:0;overflow:auto;scrollbar-width:none}
:root[data-theme="dark"] .side{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:var(--surface);color:var(--ink);border:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-stretch:125%;font-weight:850;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand i{flex:none;width:24px;height:24px;border-radius:6px;background:var(--signal);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--signal-ink)}
.navsec{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.45;padding:10px 10px 5px;white-space:nowrap}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:550;text-align:left;opacity:.72;white-space:nowrap;position:relative}
.nv svg{flex:none;width:18px;height:18px}
.nv:hover{opacity:1;background:color-mix(in srgb,currentColor 8%,transparent)}
.nv[aria-current="page"]{opacity:1;background:color-mix(in srgb,currentColor 11%,transparent)}
.nv[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.nv .soon{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;opacity:.55}
.side .sp{flex:1;min-height:12px}
.hubcard{border-radius:10px;padding:10px;border:1px solid color-mix(in srgb,currentColor 16%,transparent);display:flex;flex-direction:column;gap:4px;font-size:12px}
.hubcard .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;opacity:.75}
.hubcard .hn{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-weight:600;font-size:12.5px}
.hubcard .hn i{width:8px;height:8px;border-radius:2px;background:var(--signal)}
/* header */
.head{grid-area:head;display:flex;align-items:center;gap:12px;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.crumb span{color:var(--muted);font-size:13px}
.crumb h1{margin:0;font-stretch:125%;font-weight:850;font-size:20px}
.head .sp{flex:1}
.tool{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.tool button{border:0;background:none;padding:7px 9px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tool button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
/* panels and parts */
main{grid-area:main;min-height:0;min-width:0}
.view{height:100%;display:grid;gap:10px;min-height:0}
#vPorts{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar" "tbl log"}
#vTraffic{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);grid-template-areas:"map insp"}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-stretch:125%;font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;padding:1px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--c,var(--off))}
.chip.hub{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.chip.crit{border-color:var(--crit);color:var(--crit)} .chip.warn{border-color:var(--warn);color:var(--warn)} .chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.solid{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 9px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button b{font-family:var(--f-mono);font-weight:500;opacity:.6;margin-left:4px}
.note{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.note::before{content:"i";flex:none;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;margin-top:1px}
.tiny{font-size:11.5px;color:var(--faint)}
/* ports */
.bar{grid-area:bar;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.bar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);min-width:0}
.field input,.field select{border:0;background:none;outline:none;min-width:0;font-size:13px}
.field input{width:190px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.tblp{grid-area:tbl;display:flex;flex-direction:column}
.scroll{overflow:auto;min-height:0;flex:1}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:7px 10px;border-bottom:1px dashed var(--line);vertical-align:top}
.tbl tr.sel td{background:color-mix(in srgb,var(--info) 8%,transparent)}
.tbl td.m{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.own{min-width:150px;max-width:260px}
.own b{font-family:var(--f-mono);font-weight:600;font-size:12px;overflow-wrap:anywhere}
.flag{white-space:normal}
.own small{display:block;color:var(--faint);font-size:11px}
.gp{display:flex;flex-direction:column;gap:6px}
.gp .srvs{display:flex;gap:5px;flex-wrap:wrap}
.logp{grid-area:log;display:flex;flex-direction:column}
.log{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0}
.li{position:relative;border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 14px;font-size:12.5px}
.li::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.li .lh{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px}
.li .lh b{font-weight:600}
.li p{margin:3px 0 0}
.flag{color:var(--crit);font-size:11.5px;font-weight:600;display:block;margin-top:2px}
/* traffic */
.mapp{grid-area:map;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mapbox{position:relative;flex:1;min-height:0;background:var(--floor)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.nodes{display:flex;gap:4px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line)}
.nodes button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 8px;font-family:var(--f-mono);font-size:11.5px}
.nodes button[aria-pressed="true"]{border-color:var(--info);color:var(--info);font-weight:600}
.lgd{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);pointer-events:none}
.lgd div{display:flex;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.lgd span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgd i{width:14px;height:0;border-top:2px solid var(--c)}
.lgd i.d{border-top-style:dashed} .lgd i.t{border-top-width:1px}
#tip{position:absolute;pointer-events:none;z-index:4;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;min-width:170px;max-width:260px}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;opacity:.85}
.ttbl{flex:1;overflow:auto;min-height:0}
.insp{grid-area:insp;overflow:auto;display:flex;flex-direction:column}
.ins-hd{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.ins-hd h2{margin:0;font-family:var(--f-mono);font-weight:600;font-size:22px}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px}
.lk:first-of-type{border-top:0}
.lk>i{width:10px;height:3px;border-radius:2px;background:var(--c)}
.lk small{display:block;color:var(--faint);font-size:11px}
.rate{font-family:var(--f-mono);font-size:11.5px;text-align:right;white-space:nowrap}
.st{font-family:var(--f-mono);font-size:10.5px;font-weight:600}
.st.inuse{color:var(--ok)} .st.idle{color:var(--muted)} .st.down{color:var(--crit)} .st.unknown{color:var(--warn)}
.share{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--line);margin:6px 0}
.share i{display:block;height:100%}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dl li{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dl .dh{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.dl dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:5px 0 0;font-size:12px}
.dl dt{color:var(--muted);font-size:11.5px}.dl dd{margin:0;overflow-wrap:anywhere;font-size:11.5px}
.off{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hint{color:var(--faint);font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:99px;font-size:12.5px;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:1320px){.app{grid-template-columns:64px minmax(0,1fr)}.side .txt,.navsec,.hubcard,.nv .soon{display:none}.brand{justify-content:center;padding-inline:0}.nv{justify-content:center}
  #vPorts{grid-template-columns:minmax(0,1fr) 300px}#vTraffic{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:1020px){
  html,body{height:auto}body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"side" "head" "main"}
  .side{flex-direction:row;align-items:center;gap:4px;overflow-x:auto;padding:6px 8px}
  .side .brand{padding:0 8px 0 4px}.side .navsec,.side .sp,.side .hubcard{display:none}
  .nv[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:-6px;width:auto;height:3px;border-radius:3px}
  .head{flex-wrap:wrap}
  .view{height:auto}
  #vPorts{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "tbl" "log"}
  #vTraffic{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "insp"}
  .tblp .scroll{max-height:70vh}.logp .log{max-height:420px}
  .mapbox{height:min(62vh,520px);min-height:340px;flex:none}.ttbl{max-height:70vh}
}
@media (max-width:700px){
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr{display:block}
  .tbl.cards tr{padding:8px 10px;border-bottom:1px solid var(--line)}
  .tbl.cards td{display:flex;gap:10px;padding:3px 0;border:0;white-space:normal}
  .tbl.cards td::before{content:attr(data-l);flex:none;width:92px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
  .tbl.cards td>div{min-width:0;flex:1}
  .field input{width:130px}
  .mapbox{height:300px;min-height:0}
  .lgd{display:none}
  .crumb span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand"><i aria-hidden="true"></i><span class="txt">REGULUS</span></div>
    <div class="navsec" data-i="sec_ops"></div>
    <button class="nv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 21 8 12 13 3 8Z"/><path d="M3 12.5 12 17.5 21 12.5"/></svg><span class="txt" data-i="t_room"></span></button>
    <button class="nv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/></svg><span class="txt" data-i="t_nodes"></span></button>
    <div class="navsec" data-i="sec_net"></div>
    <button class="nv" data-v="ports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="7" width="17" height="10" rx="1.5"/><path d="M7 11h2v2H7zM11 11h2v2h-2zM15 11h2v2h-2z"/></svg><span class="txt" data-i="t_ports"></span><span class="soon">#282</span></button>
    <button class="nv" data-v="traffic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5.5" cy="12" r="2.2"/><circle cx="18.5" cy="6" r="2.2"/><circle cx="18.5" cy="18" r="2.2"/><path d="M7.5 11 16.5 7M7.5 13l9 4"/></svg><span class="txt" data-i="t_traffic"></span><span class="soon">#283</span></button>
    <div class="navsec" data-i="sec_admin"></div>
    <button class="nv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3.5h9l3 3v14H6Z"/><path d="M9 10h6M9 13.5h6M9 17h4"/></svg><span class="txt" data-i="t_audit"></span></button>
    <div class="sp"></div>
    <div class="hubcard"><div class="hn"><i></i>atlas</div><div class="row"><span data-i="hub_active"></span><span>v0.5.0</span></div></div>
  </nav>

  <header class="head">
    <div class="crumb"><span>home-lab / <span data-i="sec_net"></span> /</span><h1 id="h1"></h1></div>
    <div class="sp"></div>
    <div class="tool" role="group" aria-label="Theme"><button data-th="system">Auto</button><button data-th="light" aria-label="Light">☀</button><button data-th="dark" aria-label="Dark">☾</button></div>
    <div class="tool" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="it">IT</button></div>
  </header>

  <main>
    <!-- ===== Open ports ===== -->
    <section class="view" id="vPorts" aria-labelledby="h1">
      <div class="panel bar">
        <div class="row">
          <label class="field"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr" data-i="f_search"></span><input id="q" type="search" autocomplete="off" spellcheck="false"></label>
          <label class="field"><span class="label" data-i="c_server"></span><select id="srv"></select></label>
          <div class="seg" id="exSeg" role="group"></div>
          <label class="check"><input type="checkbox" id="unexp"><span data-i="only_unexp"></span></label>
          <span class="sp" style="flex:1"></span>
          <div class="seg" id="pvSeg" role="group"></div>
        </div>
        <div class="row stats" id="stats"></div>
        <p class="note" style="margin:0" id="pNote"></p>

/* ---------- traffic: isometric map ---------- */
const cv=$('#map'),ctx=cv.getContext('2d'),box_=$('#mapbox');const C={};
let W=0,H=0,DPR=1,sc=1,ox=0,oy=0,hover=null,raf=0;const TW=96,TH=48;
function readColors(){const cs=getComputedStyle(document.documentElement);['floor','floor-line','zone','metal-top','metal-l','metal-r','metal-edge','signal','signal-ink','ok','warn','crit','info','off','ink','muted','faint','surface','line-2','k-agent','k-update','k-repl','k-plugin','k-other','k-vpn'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}

      const m=at(Lt*.5),m2=at(Lt*.5+(fwd?6:-6));const ang=Math.atan2(m2.y-m.y,m2.x-m.x);ctx.save();ctx.translate(m.x,m.y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(5*sc,0);ctx.lineTo(-3*sc,-3.5*sc);ctx.lineTo(-3*sc,3.5*sc);ctx.closePath();ctx.fill();ctx.restore();
    }

      ctx.globalAlpha=.92;ctx.fillStyle=C.surface;ctx.fillRect(m.x+6,m.y-11,w+8,15);ctx.globalAlpha=1;label(txt,{x:m.x+10,y:m.y},col===C.off?C.muted:col,true)}

    ctx.globalAlpha=off?.55:1;const sil=box(n.x,n.y,w,d,0,h,n.role==='hub'?C.signal:n.role==='standby'?C.signal:C['metal-top']);

    if(n.id===sel){ctx.save();ctx.setLineDash([5,4]);ctx.lineDashOffset=still?0:-T*14;poly(sil,null,C.info,2);ctx.restore()}
    ctx.globalAlpha=1;hits.push({n,sil})});
  tags.forEach(([s,p,col,b])=>{ctx.font=`${b?600:500} ${Math.round(Math.max(9,Math.min(13,11*sc)))}px "IBM Plex Mono", monospace`;const w=ctx.measureText(s).width;ctx.globalAlpha=.85;ctx.fillStyle=C.floor;ctx.fillRect(p.x-w/2-3,p.y-10,w+6,14);ctx.globalAlpha=1;label(s,p,col,b,'center')});
  draw.hits=hits;
  if(!still)raf=requestAnimationFrame(draw);
}
function inside(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function dseg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let k=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;k=Math.max(0,Math.min(1,k));return Math.hypot(p.x-a.x-k*dx,p.y-a.y-k*dy)}
function pick(x,y){const p={x,y};for(const h of (draw.hits||[]).slice().reverse())if(inside(p,h.sil))return h.n;let best=null,bd=7;for(const s of segs){const d=Math.min(dseg(p,s.pts[0],s.pts[1]),dseg(p,s.pts[1],s.pts[2]));if(d<bd){bd=d;best=s.l}}return best}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,o=pick(x,y),tp=$('#tip');
  hover=o&&o.k?o:null;cv.style.cursor=o?'pointer':'default';
  if(!o){tp.hidden=true;if(RM.matches)draw();return}
  tp.hidden=false;if(o.k){const st=stateOf(o);tp.innerHTML=`<b class="mono">${epName(o.a)} → ${epName(o.b)}</b><div class="r"><span>${t('k_'+o.k)}</span><span>${t('l_'+st)}</span></div><div class="r"><span>↑ ${fmtR(o.o)}</span><span>↓ ${fmtR(o.i)}</span></div><div class="r"><span>${ownerOf(o)}</span></div><div class="r"><span>${t('tc_how')}</span><span>${t('how_'+o.how)}</span></div>`}
  else tp.innerHTML=`<b class="mono">${o.id}</b><div class="r"><span>${t(o.status)}</span><span>${fmtR(IFT[o.id])}</span></div>`;
  tp.style.left=Math.min(x+14,W-270)+'px';tp.style.top=Math.min(y+14,H-120)+'px';if(RM.matches)draw()});
cv.addEventListener('pointerleave',()=>{hover=null;$('#tip').hidden=true;if(RM.matches)draw()});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),o=pick(e.clientX-r.left,e.clientY-r.top);if(!o)return;select(o.k?(o.a.startsWith('ep:')?o.b:o.a):o.id)});

/* ---------- live-ish rates ---------- */
setInterval(()=>{LINKS.forEach(l=>{if(l.st==='inuse'&&l.o!=null){l.o*=.85+Math.random()*.3;l.i*=.85+Math.random()*.3}});if(view==='traffic'){if(!$('#insp').contains(document.activeElement))renderInsp();if(tv==='table')renderLinkTable();if(RM.matches)draw()}},3000);

/* ---------- views, theme, language ---------- */
function setView(v){view=v;store.set('rnet2-view',v);$('#vPorts').hidden=v!=='ports';$('#vTraffic').hidden=v!=='traffic';
  $$('[data-v]').forEach(b=>{if(b.dataset.v===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#h1').textContent=t(v==='ports'?'t_ports':'t_traffic');document.title=`Regulus · ${t(v==='ports'?'t_ports':'t_traffic')}`;
  if(v==='traffic'){requestAnimationFrame(()=>{fit();applyTv();renderInsp()})}else cancelAnimationFrame(raf)}
$$('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
function setTheme(v){if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);store.set('rnet2-theme',v);$$('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===v));requestAnimationFrame(()=>{readColors();draw()})}
$$('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();draw()});
RM.addEventListener('change',()=>draw());
function applyLang(){document.documentElement.lang=LANG;$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  renderPortControls();renderPorts();renderLog();renderTrafficControls();renderInsp();if(tv==='table')renderLinkTable();setView(view)}
$$('[data-l]').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;store.set('rnet2-lang',LANG);applyLang()});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#tip').hidden=true});

readColors();setTheme(store.get('rnet2-theme','system'));applyLang();
})();
</script>
