<title>Regulus Machine Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an operations floor. Left: "needs you" queue (summary first). Centre: an isometric machine room where
   every server stands where it really is (rack, desk, cloud), cabled to the hub. Right: the inspector with the
   machine's front panel. Bottom: a load wall, one row per server, one cell per minute. Industrial: concrete,
   graphite hardware, one safety-yellow signal colour reserved for the hub and for actions. */
:root{
  --bg:#e6e8e3; --surface:#f5f6f2; --surface-2:#eceee9; --ink:#14171a; --muted:#5c635e; --faint:#8a918b;
  --line:#d0d4cc; --line-2:#b9beb5;
  --signal:#ffcc12; --signal-ink:#1c1600;
  --ok:#17914c; --warn:#c77d00; --crit:#d22d47; --info:#2f56e8; --off:#8c928d;
  --floor:#dcdfd8; --floor-line:#c7cbc2; --zone:#d2d6ce;
  --metal-top:#4a5156; --metal-l:#2d3236; --metal-r:#22262a; --metal-edge:#5f676d;
  --cab:#9aa19b; --cab-line:#7d847e;
  --heat-0:#e9ece6; --heat-1:#9fd3b5; --heat-2:#f2c14a; --heat-3:#e2483f;
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1112; --surface:#171a1c; --surface-2:#1d2123; --ink:#eef0ec; --muted:#9aa29c; --faint:#6b726d;
  --line:#2a2f31; --line-2:#3a4043;
  --signal:#ffd23a; --signal-ink:#1c1600;
  --ok:#3fd47f; --warn:#ffb020; --crit:#ff5a6e; --info:#7c97ff; --off:#69706b;
  --floor:#15181a; --floor-line:#23282a; --zone:#1b1f21;
  --metal-top:#545c62; --metal-l:#353b40; --metal-r:#2a2f33; --metal-edge:#6c757b;
  --cab:#3f464a; --cab-line:#535b60;
  --heat-0:#1b1f21; --heat-1:#1f6b45; --heat-2:#b8861b; --heat-3:#c2333f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1112; --surface:#171a1c; --surface-2:#1d2123; --ink:#eef0ec; --muted:#9aa29c; --faint:#6b726d;
  --line:#2a2f31; --line-2:#3a4043;
  --signal:#ffd23a; --signal-ink:#1c1600;
  --ok:#3fd47f; --warn:#ffb020; --crit:#ff5a6e; --info:#7c97ff; --off:#69706b;
  --floor:#15181a; --floor-line:#23282a; --zone:#1b1f21;
  --metal-top:#545c62; --metal-l:#353b40; --metal-r:#2a2f33; --metal-edge:#6c757b;
  --cab:#3f464a; --cab-line:#535b60;
  --heat-0:#1b1f21; --heat-1:#1f6b45; --heat-2:#b8861b; --heat-3:#c2333f;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sev-crit{--sev:var(--crit)} .sev-warn{--sev:var(--warn)} .sev-info{--sev:var(--info)} .sev-ok{--sev:var(--ok)}

.app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) 250px;
  grid-template-areas:"top top top" "queue room insp" "wall wall insp";gap:10px}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:18px;padding:8px 10px 8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-stretch:125%;font-weight:850;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.mark i{width:22px;height:22px;border-radius:5px;background:var(--signal);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.mark i::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--signal-ink)}
.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:550;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--signal)}
.tabs button[disabled]{opacity:.45;cursor:not-allowed}
.top .sp{flex:1}
.stat{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.stat b{font-family:var(--f-disp);font-stretch:125%;font-weight:800;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.tool{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tool button{border:0;background:none;padding:6px 9px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tool button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-family:var(--f-disp);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.count{font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--surface);border-radius:99px;padding:1px 8px}

/* queue */
.queue{grid-area:queue;display:flex;flex-direction:column}
.qlist{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.qi{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px 10px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .15s}
.qi::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--sev)}
.qi:hover{border-color:var(--line-2)}
.qi[aria-current="true"]{border-color:var(--ink)}
.qi .qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qi .qs{font-family:var(--f-mono);font-size:11.5px;font-weight:500}
.qi .qt{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.qi p{margin:0;font-size:13px;line-height:1.35}
.qi .qa{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.btn.go:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.5;cursor:progress}
.qdone{margin:0;padding:12px 14px;font-size:12.5px;color:var(--muted)}
.qdone b{color:var(--ok)}

/* room */
.room{grid-area:room;position:relative;overflow:hidden;background:var(--floor)}
#iso{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.room-hd{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none}
.room-hd h1{margin:0;font-family:var(--f-disp);font-stretch:125%;font-weight:850;font-size:22px;letter-spacing:-.005em;line-height:1.05}
.room-hd p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.lgd{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:11.5px;color:var(--muted);pointer-events:auto;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.lgd span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgd i{width:8px;height:8px;border-radius:2px}
.room-ft{position:absolute;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.room-ft .hint{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.zoom{display:flex;gap:4px;pointer-events:auto}
.zoom button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono)}
#tip{position:absolute;pointer-events:none;z-index:4;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;transform:translate(14px,14px)}
#tip b{font-family:var(--f-mono);font-weight:500}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;opacity:.8}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:99px;font-size:12.5px;z-index:5;white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}

/* inspector */
.insp{grid-area:insp;overflow:auto;display:flex;flex-direction:column}
.ins-hd{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.ins-hd .where{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ins-hd h2{margin:0;font-family:var(--f-mono);font-weight:600;font-size:21px;word-break:break-all}
.ins-hd .sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.hub{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--sev)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--sev)}
.panelart{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.panelart svg{display:block;width:100%;height:auto}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.g{padding:10px 12px;border-right:1px solid var(--line)}
.g:last-child{border-right:0}
.g .v{font-family:var(--f-disp);font-stretch:112%;font-weight:750;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.g .v small{font-size:11px;font-weight:500;color:var(--muted)}
.g .track{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.g .track i{display:block;height:100%;background:var(--ink)}
.g .track i.w{background:var(--warn)} .g .track i.c{background:var(--crit)}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px dashed var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .be{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mrow .st{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--sev)}
.apps{display:flex;gap:6px;flex-wrap:wrap}
.app{font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;background:var(--surface)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.ins-act{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.tiny{font-size:11.5px;color:var(--faint)}

/* load wall */
.wall{grid-area:wall;display:flex;flex-direction:column}
.wall .ph{padding:9px 14px 8px}
.wallbox{position:relative;flex:1;min-height:0}
#heat{position:absolute;inset:0;width:100%;height:100%;display:block}
.scale{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.scale i{width:22px;height:8px;border-radius:2px}

@media (max-width:1280px){.app{grid-template-columns:260px minmax(0,1fr) 320px}.top .stat:nth-of-type(3){display:none}}
@media (max-width:1020px){
  html,body{height:auto} body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "room" "queue" "insp" "wall"}
  .room{height:min(70vh,560px);min-height:400px}
  .qlist{max-height:none}
  .wall{height:320px}
  .top{flex-wrap:wrap}
  .top .sp{display:none}
  .tabs{order:5;width:100%}
}
@media (max-width:560px){.lgd{display:none}.room-hd h1{font-size:18px}.stat{display:none}.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}.g:nth-child(2){border-right:0}.g:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
</style>

<div class="app">
  <header class="top">
    <div class="mark"><i aria-hidden="true"></i>REGULUS</div>
    <nav class="tabs" aria-label="Main">
      <button aria-current="page" data-i="t_room"></button>
      <button disabled data-i="t_servers"></button>
      <button disabled data-i="t_updates"></button>
      <button disabled data-i="t_users"></button>
    </nav>
    <div class="sp"></div>
    <div class="stat"><b id="s-on">13/15</b><span data-i="s_on"></span></div>
    <div class="stat"><b id="s-need">5</b><span data-i="s_need"></span></div>
    <div class="stat"><b id="s-pow">1.42</b><span>kW</span></div>
    <div class="tool" role="group" aria-label="Theme"><button data-th="system">Auto</button><button data-th="light">☀</button><button data-th="dark">☾</button></div>
    <div class="tool" role="group" aria-label="Language"><button data-l="it">IT</button><button data-l="en">EN</button></div>
  </header>

  <section class="panel queue" aria-labelledby="qh">
    <div class="ph"><h2 id="qh" data-i="q_title"></h2><span class="count" id="qcount">0</span></div>
    <ul class="qlist" id="queue"></ul>
  </section>

  <section class="panel room" id="room">
    <canvas id="iso" role="img" aria-label="Isometric map of the servers by location"></canvas>
    <div class="room-hd">
      <div><h1 data-i="room_title"></h1><p id="roomsub"></p></div>
      <div class="lgd" id="lgd"></div>
    </div>
    <div class="room-ft"><span class="hint" data-i="hint"></span><div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zr" aria-label="Reset view">⤢</button></div></div>
    <div id="tip" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </section>

  <aside class="panel insp" id="insp" aria-live="polite"></aside>

  <section class="panel wall">
    <div class="ph"><h2 data-i="wall_title"></h2><div class="scale"><span data-i="wall_scale"></span><i style="background:var(--heat-0);border:1px solid var(--line)"></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><span>100%</span></div></div>
    <div class="wallbox"><canvas id="heat" role="img" aria-label="CPU load per server over the last 60 minutes"></canvas></div>
  </section>
</div>

      // back posts
      ctx.strokeStyle=C['cab-line'];ctx.lineWidth=1.2;
      const h=126;for(const [px,py] of [[c.x,c.y],[c.x+w,c.y]]){const a=P(px,py,4),b=P(px,py,h);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
      S.filter(s=>s.cab===it.ci).forEach(s=>{
        const top=s.role==='hub'?C.signal:C['metal-top'];
        const sil=box(c.x+.06,c.y+.06,.88,.88,s.z,s.u*9,top,C['metal-l'],C['metal-r'],C['metal-edge']);
        if(s.role==='hub'){const a=P(c.x+.06,c.y+.94,s.z+s.u*9-2),b=P(c.x+.94,c.y+.94,s.z+s.u*9-2);ctx.strokeStyle=C.signal;ctx.lineWidth=Math.max(1.5,3*sc);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
        frontLeds(s,c.x+.06,c.y+.06,.88,.88,s.z,s.u*9,T);
        if(s.failBay!=null&&s.mgr[0][2]==='degraded'&&Math.sin(T*6)>0){const p=P(c.x+.7,c.y+.94,s.z+s.u*4.5);ctx.fillStyle=C.crit;ctx.beginPath();ctx.arc(p.x,p.y,3*sc,0,7);ctx.fill()}
        hits.push({s,sil});
      });
      // front posts + top frame
      for(const [px,py] of [[c.x,c.y+d],[c.x+w,c.y+d]]){const a=P(px,py,4),b=P(px,py,h);ctx.strokeStyle=C['cab-line'];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
      poly([P(c.x,c.y,h),P(c.x+w,c.y,h),P(c.x+w,c.y+d,h),P(c.x,c.y+d,h)],null,C['cab-line'],1.2);
      label(`${t('rack')} ${'AB'[it.ci]}`,(()=>{const p=P(c.x,c.y,h);return{x:p.x-10*sc,y:p.y-8*sc}})(),C.muted,true);
    }else{
      const s=it.s;const isV=s.zone==='cloud';const w=s.w||.8,d=s.d||.6,h=s.h||(isV?10:14),z=isV?6:0;
      if(isV){const sh=[P(s.x,s.y),P(s.x+w,s.y),P(s.x+w,s.y+d),P(s.x,s.y+d)];poly(sh,'rgba(0,0,0,.08)')}
      const top=s.role==='standby'?C.signal:C['metal-top'];
      const sil=box(s.x,s.y,w,d,z,h,top,C['metal-l'],C['metal-r'],C['metal-edge']);
      if(s.role==='standby'){ctx.save();ctx.globalAlpha=.6;box(s.x+.1,s.y+.1,w-.2,d-.2,z+h,0.1,C.signal,C.signal,C.signal);ctx.restore()}
      frontLeds(s,s.x,s.y,w,d,z,h,T);
      if(s.status==='booting'){const p=P(s.x+w/2,s.y+d/2,z+h+6+Math.sin(T*4)*3);ctx.fillStyle=C.warn;ctx.beginPath();ctx.arc(p.x,p.y,4*sc,0,7);ctx.fill()}
      hits.push({s,sil});
      // name tag on the floor in front
      const lp=P(s.x,s.y+d+.18,0);label(s.id,{x:lp.x,y:lp.y+10*sc},s.status==='offline'?C.faint:C.ink,false);
    }
  }
  // rack unit labels to the right of each cabinet
  CABS.forEach((c,ci)=>S.filter(s=>s.cab===ci).forEach(s=>{const L=ci===0;const p=L?P(c.x-.02,c.y+.94,s.z+s.u*4.5):P(c.x+1.08,c.y+.94,s.z+s.u*4.5);ctx.strokeStyle=C.faint;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x+(L?6:-4)*sc,p.y);ctx.lineTo(p.x+(L?-8:6)*sc,p.y);ctx.stroke();ctx.textAlign=L?'right':'left';label(s.id,{x:p.x+(L?-11:9)*sc,y:p.y+4*sc},s.status==='offline'?C.faint:s===hover?C.info:C.ink,s.role==='hub');ctx.textAlign='left'}));
  // hub port tag
  ctx.fillStyle=C.signal;ctx.fillRect(hpp.x-4*sc,hpp.y-1*sc,58*sc,15*sc);label('HUB :8443',{x:hpp.x,y:hpp.y+10*sc},C['signal-ink'],true);
  // selection outline
  const sel=hits.find(h=>h.s.id===selected);if(sel){ctx.save();ctx.setLineDash([5,4]);ctx.lineDashOffset=-T*14;poly(sel.sil,null,C.info,2);ctx.restore()}
  if(hover){const hh=hits.find(h=>h.s===hover);if(hh)poly(hh.sil,null,C.ink,1.4)}
  requestAnimationFrame(draw);
}
function inside(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function pick(x,y){for(let i=hits.length-1;i>=0;i--)if(inside({x,y},hits[i].sil))return hits[i].s;return null}
let zoomK=1,drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,m:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;if(drag.m>4){panX+=dx;panY+=dy;$('#tip').hidden=true}return}
  hover=pick(x,y);cv.style.cursor=hover?'pointer':'grab';const tp=$('#tip');
  if(hover){const s=hover,live=s.status!=='offline';tp.hidden=false;tp.innerHTML=`<b>${s.id}</b><div class="r"><span>${t(s.status)}</span><span>${live?`CPU ${Math.round(s.cpu)}%`:''}</span></div>${live&&s.temp?`<div class="r"><span>${t('i_temp')}</span><span>${Math.round(s.temp)} °C</span></div>`:''}<div class="r"><span>${t('i_disk')}</span><span>${s.disk}%</span></div>`;tp.style.left=Math.min(x,W-190)+'px';tp.style.top=Math.min(y,H-90)+'px'}else tp.hidden=true});
cv.addEventListener('pointerup',e=>{const r=cv.getBoundingClientRect();if(drag&&drag.m<5){const s=pick(e.clientX-r.left,e.clientY-r.top);if(s)select(s.id)}drag=null});
cv.addEventListener('pointerleave',()=>{hover=null;$('#tip').hidden=true});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomK=clamp(zoomK*(e.deltaY<0?1.1:.91),.6,2.4)},{passive:false});
$('#zi').onclick=()=>zoomK=clamp(zoomK*1.2,.6,2.4);$('#zo').onclick=()=>zoomK=clamp(zoomK/1.2,.6,2.4);$('#zr').onclick=()=>{zoomK=1;panX=0;panY=0};

/* ---------- load wall (heatmap) ---------- */
const hc=$('#heat'),hx=hc.getContext('2d');
function heatColor(v){if(v<0)return null;const st=[C['heat-0'],C['heat-1'],C['heat-2'],C['heat-3']];const f=clamp(v,0,99.9)/100*3,i=Math.floor(f),k=f-i;return mix(st[i],st[i+1],k)}
function hex(c){c=c.replace('#','');if(c.length===3)c=[...c].map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
function mix(a,b,k){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`}
function drawHeat(){
  const r=hc.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);hc.width=Math.round(r.width*d);hc.height=Math.round(r.height*d);
  hx.setTransform(d,0,0,d,0,0);hx.clearRect(0,0,r.width,r.height);
  const lw=118,pad=8,rows=S.length,rh=(r.height-pad-16)/rows,cw=(r.width-lw-14)/60;
  hx.font='500 10.5px "IBM Plex Mono", monospace';hx.textBaseline='middle';
  S.forEach((s,i)=>{const y=pad+i*rh;
    hx.fillStyle=s.id===selected?C.info:s.status==='offline'?C.faint:C.ink;hx.fillText(s.id,8,y+rh/2);
    s.hist.forEach((v,k)=>{const c=heatColor(v);const x=lw+k*cw;if(c){hx.fillStyle=c;hx.fillRect(x,y+.5,cw-1,rh-1.5)}else{hx.strokeStyle=C['line-2'];hx.beginPath();hx.moveTo(x,y+rh-1.5);hx.lineTo(x+cw-1,y+.5);hx.stroke()}});
    if(s.id===selected){hx.strokeStyle=C.info;hx.lineWidth=1.5;hx.strokeRect(lw-1,y,60*cw+1,rh-.5);hx.lineWidth=1}
  });
  hx.fillStyle=C.muted;hx.textBaseline='alphabetic';[['−60 min',0],['−30',30],[LANG==='it'?'adesso':'now',59]].forEach(([l,k])=>{const x=lw+k*cw;hx.textAlign=k===59?'right':'left';hx.fillText(l,k===59?x+cw:x,r.height-3)});hx.textAlign='left';
  drawHeat.geom={lw,pad,rh,cw};
}
hc.addEventListener('click',e=>{const g=drawHeat.geom;if(!g)return;const r=hc.getBoundingClientRect();const i=Math.floor((e.clientY-r.top-g.pad)/g.rh);if(S[i])select(S[i].id),drawHeat()});
hc.style.cursor='pointer';

/* ---------- simulation tick ---------- */
let minuteAcc=0;
function tick(){
  const T=now();
  S.forEach(s=>{
    if(s.status==='online'||s.status==='stale'||s.status==='updating'){
      s.cpu=clamp(s.cpu+(Math.random()-.5)*8+(s.base.cpu-s.cpu)*.15,1,99);s.mem=clamp(s.mem+(Math.random()-.5)*1.5+(s.base.mem-s.mem)*.1,1,99);
      if(s.temp)s.temp=clamp(s.temp+(Math.random()-.5)*.8+(s.base.temp+(s.cpu-s.base.cpu)*.2-s.temp)*.1,20,95);
      if(s.status==='online'&&T-s.lastHb>=15)s.lastHb=T;
    }
  });
  // the wall moves one column every 4 s here (one per minute on a real hub)
  if(++minuteAcc>=4){minuteAcc=0;S.forEach(s=>{s.hist.push(s.status==='offline'?-1:s.status==='booting'?20:s.cpu);s.hist.shift()})}
  const on=S.filter(s=>s.status==='online').length;$('#s-on').textContent=`${on}/${S.length}`;
  $('#s-pow').textContent=(S.filter(s=>s.status!=='offline'&&s.zone!=='cloud').reduce((a,s)=>a+60+s.cpu*1.6,0)/1000).toFixed(2);
  liveInsp();drawHeat();
  if(T%5<1)renderQueue();
}

/* ---------- theme & language ---------- */
function setTheme(v){if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);store.set('rmr-theme',v);$$('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===v));requestAnimationFrame(()=>{readColors();drawHeat();renderInsp()})}
$$('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();drawHeat()});
function renderAll(){renderQueue();renderInsp();drawHeat()}
function applyLang(){document.documentElement.lang=LANG;$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  $('#roomsub').textContent=t('sub',{n:S.length});
  $('#lgd').innerHTML=`<span><i style="background:var(--ok)"></i>${t('online')}</span><span><i style="background:var(--warn)"></i>${t('stale')}</span><span><i style="background:var(--off)"></i>${t('offline')}</span><span><i style="background:var(--signal)"></i>hub</span><span><i style="background:var(--info)"></i>${LANG==='it'?'traffico':'traffic'}</span>`;
  renderAll()}
$$('[data-l]').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;store.set('rmr-lang',LANG);applyLang()});

/* ---------- boot ---------- */
readColors();setTheme(store.get('rmr-theme','system'));fit();applyLang();tick();setInterval(tick,1000);requestAnimationFrame(draw);
})();
</script>
