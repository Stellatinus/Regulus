<title>Regulus Machine Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: left sidebar (navigation, group, hub status) + header (breadcrumb, search, alerts, theme, language).
   Body: the isometric machine room, the inspector with the node's front panel on the right, the load wall below.
   Alerts live on the nodes themselves (pins in the room) and in a drawer, not in a permanent column.
   Industrial palette: concrete, graphite hardware, one safety-yellow signal for the hub and for primary actions. */
:root{
  --bg:#e6e8e3; --surface:#f5f6f2; --surface-2:#eceee9; --ink:#14171a; --muted:#5c635e; --faint:#8a918b;
  --line:#d0d4cc; --line-2:#b9beb5;
  --signal:#ffcc12; --signal-ink:#1c1600;
  --ok:#17914c; --warn:#c77d00; --crit:#d22d47; --info:#2f56e8; --off:#8c928d;
  --floor:#dcdfd8; --floor-line:#c7cbc2; --zone:#d2d6ce;
  --metal-top:#4a5156; --metal-l:#2d3236; --metal-r:#22262a; --metal-edge:#5f676d;
  --cab:#9aa19b; --cab-line:#7d847e;
  --heat-0:#e9ece6; --heat-1:#9fd3b5; --heat-2:#f2c14a; --heat-3:#e2483f;
  --scrim:rgba(20,23,26,.35);
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1112; --surface:#171a1c; --surface-2:#1d2123; --ink:#eef0ec; --muted:#9aa29c; --faint:#6b726d;
  --line:#2a2f31; --line-2:#3a4043; --signal:#ffd23a; --signal-ink:#1c1600;
  --ok:#3fd47f; --warn:#ffb020; --crit:#ff5a6e; --info:#7c97ff; --off:#69706b;
  --floor:#15181a; --floor-line:#23282a; --zone:#1b1f21;
  --metal-top:#545c62; --metal-l:#353b40; --metal-r:#2a2f33; --metal-edge:#6c757b;
  --cab:#3f464a; --cab-line:#535b60;
  --heat-0:#1b1f21; --heat-1:#1f6b45; --heat-2:#b8861b; --heat-3:#c2333f; --scrim:rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1112; --surface:#171a1c; --surface-2:#1d2123; --ink:#eef0ec; --muted:#9aa29c; --faint:#6b726d;
  --line:#2a2f31; --line-2:#3a4043; --signal:#ffd23a; --signal-ink:#1c1600;
  --ok:#3fd47f; --warn:#ffb020; --crit:#ff5a6e; --info:#7c97ff; --off:#69706b;
  --floor:#15181a; --floor-line:#23282a; --zone:#1b1f21;
  --metal-top:#545c62; --metal-l:#353b40; --metal-r:#2a2f33; --metal-edge:#6c757b;
  --cab:#3f464a; --cab-line:#535b60;
  --heat-0:#1b1f21; --heat-1:#1f6b45; --heat-2:#b8861b; --heat-3:#c2333f; --scrim:rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sev-crit{--sev:var(--crit)} .sev-warn{--sev:var(--warn)} .sev-info{--sev:var(--info)} .sev-ok{--sev:var(--ok)} .sev-off{--sev:var(--off)}

.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr) 360px;grid-template-rows:52px minmax(0,1fr) 250px;
  grid-template-areas:"side head head" "side room insp" "side wall insp";gap:10px}
.app.collapsed{grid-template-columns:64px minmax(0,1fr) 360px}

/* ---------- sidebar ---------- */
.side{grid-area:side;display:flex;flex-direction:column;background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 10px;min-height:0;overflow:auto;scrollbar-width:none}
:root[data-theme="dark"] .side{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:var(--surface);color:var(--ink);border:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-family:var(--f-disp);font-stretch:125%;font-weight:850;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand i{flex:none;width:24px;height:24px;border-radius:6px;background:var(--signal);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--signal-ink)}
.grp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid color-mix(in srgb,currentColor 18%,transparent);background:color-mix(in srgb,currentColor 6%,transparent);margin-bottom:14px}
.grp .gi{flex:none;width:28px;height:28px;border-radius:7px;background:color-mix(in srgb,currentColor 14%,transparent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px}
.grp b{display:block;font-weight:650;font-size:13px}
.grp small{display:block;font-size:11px;opacity:.6}
.grp .chev{margin-left:auto;opacity:.5}
.navsec{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.45;padding:10px 10px 5px;white-space:nowrap}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:550;text-align:left;opacity:.72;white-space:nowrap;position:relative}
.nv svg{flex:none;width:18px;height:18px}
.nv:hover{opacity:1;background:color-mix(in srgb,currentColor 8%,transparent)}
.nv[aria-current="page"]{opacity:1;background:color-mix(in srgb,currentColor 11%,transparent)}
.nv[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.nv .badge{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;font-weight:600;background:var(--crit);color:#fff;border-radius:99px;padding:0 7px}
.nv .soon{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;opacity:.55}
.side .sp{flex:1;min-height:12px}
.hubcard{border-radius:10px;padding:10px;border:1px solid color-mix(in srgb,currentColor 16%,transparent);display:flex;flex-direction:column;gap:4px;font-size:12px;margin-bottom:10px}
.hubcard .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;opacity:.75}
.hubcard .hn{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-weight:600;font-size:12.5px}
.hubcard .hn i{width:8px;height:8px;border-radius:2px;background:var(--signal)}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px}
.me .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.me b{display:block;font-size:13px;font-weight:600}
.me small{display:block;font-size:11px;opacity:.6}
.collapse{border:0;background:none;opacity:.55;padding:6px;border-radius:8px;margin-left:auto}
.collapse:hover{opacity:1}
.app.collapsed .side .txt,.app.collapsed .navsec,.app.collapsed .grp>div,.app.collapsed .grp .chev,.app.collapsed .hubcard,.app.collapsed .me>div,.app.collapsed .nv .badge,.app.collapsed .nv .soon{display:none}
.app.collapsed .brand{justify-content:center;padding-inline:0}
.app.collapsed .grp{justify-content:center;padding:6px}
.app.collapsed .nv{justify-content:center}
.app.collapsed .collapse{margin:0 auto;transform:scaleX(-1)}

/* ---------- header ---------- */
.head{grid-area:head;display:flex;align-items:center;gap:12px;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.crumb span{color:var(--muted);font-size:13px}
.crumb h1{margin:0;font-family:var(--f-disp);font-stretch:125%;font-weight:850;font-size:20px;letter-spacing:-.005em}
.head .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;width:300px;min-width:0;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.bell{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.bell:hover{border-color:var(--ink)}
.bell b{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--crit);color:#fff;font-family:var(--f-mono);font-size:10.5px;display:grid;place-items:center;border:2px solid var(--bg)}
.tool{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.tool button{border:0;background:none;padding:7px 9px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tool button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-family:var(--f-disp);font-stretch:125%;font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}

/* ---------- room ---------- */
.room{grid-area:room;position:relative;overflow:hidden;background:var(--floor)}
#iso{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.room-top{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);pointer-events:auto}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button b{font-family:var(--f-mono);font-weight:500;opacity:.6;margin-left:4px}
.alertsum{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.asum{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:12.5px;font-weight:600}
.asum i{width:9px;height:9px;border-radius:50%;background:var(--sev)}
.asum:hover{border-color:var(--ink)}
.room-ft{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);border-radius:9px;padding:6px 10px;pointer-events:auto}
.lgd span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgd i{width:8px;height:8px;border-radius:2px}
.zoom{display:flex;gap:4px;pointer-events:auto}
.zoom button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono)}
#tip{position:absolute;pointer-events:none;z-index:4;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;transform:translate(14px,14px)}
#tip b{font-family:var(--f-mono);font-weight:500}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;opacity:.8}
#tip .al{margin-top:5px;padding-top:5px;border-top:1px solid color-mix(in srgb,var(--surface) 25%,transparent);font-size:11.5px;max-width:240px}
.toast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:99px;font-size:12.5px;z-index:5;white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}

/* ---------- inspector ---------- */
.insp{grid-area:insp;overflow:auto;display:flex;flex-direction:column}
.ins-hd{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.ins-hd .where{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ins-hd h2{margin:0;font-family:var(--f-mono);font-weight:600;font-size:22px;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.hub{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--sev)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--sev)}
.ialert{margin:12px 16px 0;border:1px solid var(--sev);border-left-width:4px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--sev) 7%,var(--surface))}
.ialert p{margin:0;font-size:13px;line-height:1.35}
.ialert .label{color:var(--sev)}
.ialert .qa{display:flex;gap:6px;flex-wrap:wrap}
.panelart{padding:14px 16px;border-bottom:1px solid var(--line)}
.panelart svg{display:block;width:100%;height:auto}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.g{padding:10px 12px;border-right:1px solid var(--line)}
.g:last-child{border-right:0}
.g .v{font-family:var(--f-disp);font-stretch:112%;font-weight:750;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.g .v small{font-size:11px;font-weight:500;color:var(--muted)}
.g .track{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.g .track i{display:block;height:100%;background:var(--ink)}
.g .track i.w{background:var(--warn)} .g .track i.c{background:var(--crit)}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px dashed var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .be{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mrow .st{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--sev)}
.apps{display:flex;gap:6px;flex-wrap:wrap}
.app{font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:6px;padding:3px 8px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.ins-act{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.tiny{font-size:11.5px;color:var(--faint)}

/* ---------- load wall ---------- */
.wall{grid-area:wall;display:flex;flex-direction:column}
.wallbox{position:relative;flex:1;min-height:0}
#heat{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.scale{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.scale i{width:22px;height:8px;border-radius:2px}

/* ---------- drawer & palette ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(420px,100%);z-index:41;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .ph{padding:16px 18px 12px}
.drawer .ph h2{font-size:14px}
.dclose{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:8px}
.dfilter{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dfilter button{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.dfilter button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.qlist{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.qi{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.qi::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--sev)}
.qi:hover{border-color:var(--line-2)}
.qi .qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qi .qs{font-family:var(--f-mono);font-size:12px;font-weight:600}
.qi .qt{font-family:var(--f-mono);font-size:10.5px;color:var(--sev);font-weight:600}
.qi p{margin:0;font-size:13px;line-height:1.35}
.qi .qa{display:flex;gap:6px;flex-wrap:wrap}
.qdone{padding:14px;font-size:13px;color:var(--muted)}
.qdone b{color:var(--ok)}
.palette-ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.palette{width:min(540px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;font-size:15px;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.palette li i{width:8px;height:8px;border-radius:2px;background:var(--sev)}
.palette li .h{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.palette li[aria-selected="true"]{background:var(--surface-2)}

@media (max-width:1320px){.app{grid-template-columns:64px minmax(0,1fr) 330px}.app .side .txt,.app .navsec,.app .grp>div,.app .grp .chev,.app .hubcard,.app .me>div,.app .nv .badge,.app .nv .soon,.collapse{display:none}.brand{justify-content:center;padding-inline:0}.grp{justify-content:center;padding:6px}.nv{justify-content:center}.search{width:220px}}
@media (max-width:1020px){
  html,body{height:auto} body{overflow:auto}
  .app,.app.collapsed{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"side" "head" "room" "insp" "wall"}
  .side{flex-direction:row;align-items:center;gap:4px;overflow-x:auto;padding:6px 8px}
  .side .brand{padding:0 8px 0 4px}
  .side .grp,.side .navsec,.side .sp,.side .hubcard,.side .me,.collapse{display:none}
  .nv[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:-6px;width:auto;height:3px;border-radius:3px}
  .room{height:min(70vh,560px);min-height:420px}
  .wall{height:320px}
  .head{flex-wrap:wrap}

function alerts(){

const alertOf=id=>alerts().find(a=>a.node===id);

function act(a,id,node){

function frontPanel(s){
  // the node as you would see it standing in front of it: drive bays, LEDs, vents, power button

  let g=`<svg viewBox="0 0 ${W} ${H+18}" role="img" aria-label="Front panel of ${s.id}">`;
  g+=`<rect x="1" y="1" width="${W-2}" height="${H}" rx="6" fill="var(--metal-l)" stroke="var(--metal-edge)"/>`;
  if(rack){g+=`<rect x="1" y="1" width="16" height="${H}" rx="3" fill="var(--metal-r)"/><rect x="${W-17}" y="1" width="16" height="${H}" rx="3" fill="var(--metal-r)"/>`;for(let k=0;k<2;k++)g+=`<circle cx="9" cy="${H/2*(k+.5)}" r="2.6" fill="var(--metal-top)"/><circle cx="${W-9}" cy="${H/2*(k+.5)}" r="2.6" fill="var(--metal-top)"/>`}

function hex(c){c=c.replace('#','');if(c.length===3)c=[...c].map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
function mix(a,b,k){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`}
function heatColor(v){if(v<0)return null;const st=[C['heat-0'],C['heat-1'],C['heat-2'],C['heat-3']],f=clamp(v,0,99.9)/100*3,i=Math.floor(f);return mix(st[i],st[i+1],f-i)}
let rowsShown=[];
function drawHeat(){
  const r=hc.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);hc.width=Math.round(r.width*d);hc.height=Math.round(r.height*d);
  hx.setTransform(d,0,0,d,0,0);hx.clearRect(0,0,r.width,r.height);
  rowsShown=S.filter(inZone);const lw=92,pad=8,rh=Math.min(16,(r.height-pad-18)/rowsShown.length),cw=(r.width-lw-14)/60;
  hx.font='500 10.5px "IBM Plex Mono", monospace';hx.textBaseline='middle';
  rowsShown.forEach((s,i)=>{const y=pad+i*rh;hx.fillStyle=s.id===selected?C.info:s.status==='offline'?C.faint:C.ink;hx.fillText(s.id,8,y+rh/2);
    s.hist.forEach((v,k)=>{const c=heatColor(v),x=lw+k*cw;if(c){hx.fillStyle=c;hx.fillRect(x,y+.5,cw-1,rh-1.5)}else{hx.strokeStyle=C['line-2'];hx.beginPath();hx.moveTo(x,y+rh-1.5);hx.lineTo(x+cw-1,y+.5);hx.stroke()}});
    if(s.id===selected){hx.strokeStyle=C.info;hx.lineWidth=1.5;hx.strokeRect(lw-1,y,60*cw+1,rh-.5);hx.lineWidth=1}});
  hx.fillStyle=C.muted;hx.textBaseline='alphabetic';const yb=pad+rowsShown.length*rh+13;
  [['−60 min',0],['−30',30],[t('now'),59]].forEach(([l,k])=>{const x=lw+k*cw;hx.textAlign=k===59?'right':'left';hx.fillText(l,k===59?x+cw:x,yb)});hx.textAlign='left';
  drawHeat.g={pad,rh};
}
hc.addEventListener('click',e=>{const g=drawHeat.g;if(!g)return;const r=hc.getBoundingClientRect(),i=Math.floor((e.clientY-r.top-g.pad)/g.rh);if(rowsShown[i])select(rowsShown[i].id)});

/* ---------- search palette ---------- */
const pOv=$('#palOv'),pIn=$('#pIn'),pList=$('#pList');let pSel=0,pItems=[];
function openPal(){pOv.hidden=false;pIn.value='';pIn.placeholder=t('search');pSel=0;renderPal();pIn.focus()}
function closePal(){pOv.hidden=true}
function renderPal(){const q=pIn.value.toLowerCase();
  pItems=[...S.map(s=>({l:s.id,h:`${whereOf(s)} · ${t(s.status)}`,sev:sevOf(s),f:()=>select(s.id)})),{l:t('t_alerts'),h:String(alerts().length),sev:'crit',f:()=>openDrawer()}].filter(i=>(i.l+' '+i.h).toLowerCase().includes(q)).slice(0,12);
  pSel=Math.min(pSel,Math.max(0,pItems.length-1));
  pList.innerHTML=pItems.map((i,k)=>`<li role="option" class="sev-${i.sev}" aria-selected="${k===pSel}" data-k="${k}"><i></i><span class="mono">${i.l}</span><span class="h">${i.h}</span></li>`).join('');
  $$('#pList li').forEach(li=>li.onclick=()=>{const it=pItems[+li.dataset.k];closePal();it.f()})}
pIn.oninput=()=>{pSel=0;renderPal()};
pIn.onkeydown=e=>{if(e.key==='ArrowDown'){pSel=Math.min(pItems.length-1,pSel+1);renderPal();e.preventDefault()}else if(e.key==='ArrowUp'){pSel=Math.max(0,pSel-1);renderPal();e.preventDefault()}else if(e.key==='Enter'&&pItems[pSel]){const it=pItems[pSel];closePal();it.f()}};
pOv.onclick=e=>{if(e.target===pOv)closePal()};$('#openPal').onclick=openPal;
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pOv.hidden?openPal():closePal()}else if(e.key==='Escape'){closePal();closeDrawer()}});

/* ---------- tick ---------- */
let acc=0;
function tick(){
  const T=now();
  S.forEach(s=>{if(['online','stale','updating'].includes(s.status)){s.cpu=clamp(s.cpu+(Math.random()-.5)*8+(s.base.cpu-s.cpu)*.15,1,99);s.mem=clamp(s.mem+(Math.random()-.5)*1.5+(s.base.mem-s.mem)*.1,1,99);
    if(s.temp)s.temp=clamp(s.temp+(Math.random()-.5)*.8+(s.base.temp+(s.cpu-s.base.cpu)*.2-s.temp)*.1,20,95);if(s.status==='online'&&T-s.lastHb>=15)s.lastHb=T}});
  if(++acc>=4){acc=0;S.forEach(s=>{s.hist.push(s.status==='offline'?-1:s.status==='booting'?20:s.cpu);s.hist.shift()})}
  liveInsp();drawHeat();
}

/* ---------- theme, language, sidebar ---------- */
function setTheme(v){if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);store.set('rmr2-theme',v);$$('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===v));requestAnimationFrame(()=>{readColors();drawHeat()})}
$$('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();drawHeat()});
$('#collapse').onclick=()=>{$('#app').classList.toggle('collapsed');store.set('rmr2-col',$('#app').classList.contains('collapsed')?'1':'0')};
if(store.get('rmr2-col','0')==='1')$('#app').classList.add('collapsed');
function renderAll(){renderAlertSummary();renderInsp();if(!$('#drawer').hidden)renderDrawer();drawHeat()}
function applyLang(){document.documentElement.lang=LANG;$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  $('#grpsub').textContent=t('grpsub',{n:S.length});
  $('#lgd').innerHTML=`<span><i style="background:var(--ok)"></i>${t('online')}</span><span><i style="background:var(--warn)"></i>${t('stale')}</span><span><i style="background:var(--off)"></i>${t('offline')}</span><span><i style="background:var(--signal)"></i>hub</span><span><i style="background:var(--info)"></i>${t('lg_traffic')}</span><span><i style="background:var(--crit);border-radius:50%"></i>${t('lg_alert')}</span>`;
  renderZones();renderAll()}
$$('[data-l]').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;store.set('rmr2-lang',LANG);applyLang()});

readColors();setTheme(store.get('rmr2-theme','system'));fit();applyLang();tick();setInterval(tick,1000);requestAnimationFrame(draw);
})();
</script>
