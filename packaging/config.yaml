# Regulus hub configuration. Environment variables (REGULUS_*, also from
# /etc/regulus/regulus.env) and command-line flags override these values.
# Restart the service after changing it: sudo systemctl restart regulus

# Address of the dashboard and API. The default answers on this machine only:
# reach it with an SSH tunnel (ssh -L 8080:127.0.0.1:8080 you@this-server, then
# open http://localhost:8080), or open it to the network in one of two ways:
#   - a reverse proxy with TLS in front, keeping 127.0.0.1:8080 here and
#     setting trusted_proxies below;
#   - tls_cert and tls_key below, and listen: ":8443" (every interface).
# ":8080" alone serves plain HTTP on every interface: passwords and session
# cookies then cross the network in the clear, and the hub warns at start.
listen: "127.0.0.1:8080"

# Certificate (PEM, with its chain) and private key to serve the dashboard over
# HTTPS. Both or neither. The key must be readable by the regulus user, for
# example root:regulus 0640. Renewed files are picked up within a minute.
# tls_cert: /etc/regulus/tls/cert.pem
# tls_key: /etc/regulus/tls/key.pem

# Address where remote agents connect (gRPC over TLS with client certificates).
# Off by default. Enable it to manage other servers: the dashboard then makes
# a one-time token and the install command for each new server. Open this port
# in the firewall only towards the servers you manage.
# agent_listen: ":8443"

# Behind a reverse proxy: the proxy addresses (single addresses or CIDR blocks)
# whose X-Forwarded-For and X-Forwarded-Proto headers the hub believes. Without
# it every client shares the proxy's address in the login limit, the audit log
# and the session list. Leave it empty when nothing sits in front of the hub.
# trusted_proxies: ["127.0.0.1"]

# Where the hub keeps its database. Created by the service unit.
data_dir: /var/lib/regulus

# Where the hub keeps its data. The default is a SQLite file in data_dir and
# needs nothing. To use a PostgreSQL server you prepared (the installer asks;
# see docs/installation.md), set the connection here. The PASSWORD IS NOT SET
# HERE: put REGULUS_DATABASE_PASSWORD=... in /etc/regulus/regulus.env (mode
# 0640, root:regulus). The hub refuses a password in this file.
# database:
#   type: postgres  # sqlite (default) or postgres
#   host: db.example
#   port: 5432
#   name: regulus
#   user: regulus
#   sslmode: prefer  # disable, allow, prefer, require, verify-ca, verify-full
#   sslrootcert: ""  # CA file, for verify-ca and verify-full
#   schema: ""       # empty means public

# Run an agent inside the hub, so this server is managed like the others.
builtin_agent: true

# How often agents report their metrics (at least 1s).
metrics_interval: 10s

# Memory for the metrics history of all agents together (at least 4MiB). When it
# is full the oldest samples go first. Raise it for a large fleet.
metrics_budget: 256MiB

# Plugins the hub runs, each as its own process (docs/plugins/runtime.md). Off
# by default. Whatever is in this directory runs as the regulus user: keep it
# owned by root and not writable by regulus.
# plugins_dir: /usr/local/lib/regulus/plugins

# GET /metrics in the Prometheus text format (docs/metrics.md). Off by default.
# It needs a token of at least 32 characters, which is read only from the
# environment: put REGULUS_PROMETHEUS_TOKEN=... in /etc/regulus/regulus.env
# (mode 0640, root:regulus). The hub refuses to start with it on and no token.
# prometheus:
#   enabled: true

log:
  level: info # debug, info, warn, error
  format: text # text, json

# Look for new releases on GitHub every few hours (api.github.com). What to do
# when one is found, and the channel (stable, beta or alpha), are chosen in the
# dashboard. Set to false on a hub that must not contact the internet.
updates:
  check: true

# Let the dashboard install a downloaded update. The installer turns this on
# together with the systemd unit that does the installing as root (see
# regulus-update.path); on its own the setting does nothing.
  apply: false
