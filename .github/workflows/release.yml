name: Release

# Publishes a GitHub Release for a version tag: v1.2.0 is a stable release,
# v1.2.0-beta.1 (or -rc.1) a beta, v1.2.0-alpha.1 an alpha. It runs when a tag
# is pushed, or when "Publish release" (publish-release.yml) starts it on the
# tag it made. It must run on the tag: the hub only accepts a signature made by
# release.yml@refs/tags/<tag>.
#
# Two jobs, because the signing identity is the root of trust of every hub and
# agent (#206):
#   build    runs the dependency installs and build scripts (npm, Go, GoReleaser)
#            with a read-only token and NO id-token, so nothing it runs can ask
#            Sigstore for a certificate.
#   publish  runs no install and no build: it checks the files the build made
#            against checksums.txt, signs checksums.txt and uploads the release.
#            It is the only job with id-token and contents: write.
# The tools are pinned to a version here and every action to a commit
# (scripts/pin-actions.sh; CI runs it with --check): see docs/decisions.md,
# "The release workflow".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Run on a release tag (the "Use workflow from" box), by
      # refresh-latest.yml or by hand: builds nothing and publishes no release,
      # only makes a new signed latest.json for that tag and replaces it on the
      # release (#263). It has to run at a tag because the signature names the
      # workflow at the tag: only a release tag whose release.yml has this input
      # can be refreshed.
      refresh_only:
        description: "Only refresh latest.json (the signed index of releases); build and publish nothing"
        type: boolean
        default: false

# No permission at all unless a job asks for it.
permissions: {}

env:
  GORELEASER_VERSION: v2.12.0
  COSIGN_VERSION: v2.6.1
  SYFT_VERSION: v1.57.2

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && inputs.refresh_only != true
    permissions:
      contents: read
      actions: read # to read the result of CI on this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the git history, and the check below needs main
          persist-credentials: false
      # A tag pushed by hand skips publish-release.yml, which is where the
      # checks used to live (#207). They are repeated here, in the workflow
      # whose identity is trusted. They are not the whole protection: the
      # workflow file that runs is the one at the tagged commit, so someone who
      # can push a tag can also remove these steps. What stops that is who may
      # create `v*` tags and who may approve the `release` environment (see
      # docs/releases.md); these steps stop a mistake and an unreviewed commit.
      - name: Only a commit on main whose CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # fetch-depth 0 above brought every branch.
          git rev-parse --verify -q refs/remotes/origin/main >/dev/null || { echo "::error::main was not fetched"; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} is on ${GITHUB_SHA}, which is not on main. Releases are made from main only."
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0] // {} | (.status // "") + " " + (.conclusion // "")')
          if [ "$run" != "completed success" ]; then
            echo "::error::CI has not passed on ${GITHUB_SHA} (${run:-no run}). Releases are made from a commit with green CI."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main and CI passed."
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          # Builds the archives, packages, SBOMs and checksums.txt. Signing and
          # uploading are the next job's.
          args: release --clean --skip=publish,sign,announce
      - name: Collect the files of the release
        run: |
          set -eu
          mkdir release
          cp dist/checksums.txt dist/CHANGELOG.md release/
          for f in dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sbom.json; do
            [ -e "$f" ] && cp "$f" release/
          done
          # The installer is published, and signed, with the packages.
          cp packaging/install.sh release/install.sh
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  # The signed index of releases (latest.json, #263). Like build, this job has
  # no id-token: it only makes the file. publish-index signs it.
  index:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Make latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate >releases.json
          go run ./cmd/make-latest -releases releases.json -tag "$TAG" -o latest.json
          cat latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-index
          path: latest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Protection rules of this environment (required reviewers, only `v*` tags)
    # are set in the repository settings; without them it changes nothing.
    environment: release
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signing with Sigstore
      attestations: write # build provenance of the archives and packages (#215)
    steps:
      # The download is checked against the digest of the upload (the action
      # fails on a mismatch). No checkout and no install in this job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files against checksums.txt
        working-directory: release
        run: |
          set -eu
          sha256sum --check --strict checksums.txt
          # Nothing is published that checksums.txt does not name.
          for f in *; do
            case "$f" in checksums.txt | CHANGELOG.md) continue ;; esac
            grep -q -- "  $f\$" checksums.txt || { echo "::error::$f is not listed in checksums.txt"; exit 1; }
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign checksums.txt
        working-directory: release
        run: |
          # The hub verifies this file in-process and reads the Sigstore bundle
          # format; cosign 2 writes an older layout unless asked.
          cosign sign-blob --yes --new-bundle-format --bundle checksums.txt.sigstore.json checksums.txt
      # Provenance (SLSA) for the archives and packages, made by this workflow
      # at this tag, from the files the build job produced and checksums.txt
      # vouches for. Verify with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
      - name: Add the provenance to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" release/provenance.sigstore.json
      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          {
            printf 'Install this version on Ubuntu Server 22.04 or newer:\n\n```sh\n'
            printf 'curl -fsSLO https://github.com/%s/releases/download/%s/install.sh\n' "$GITHUB_REPOSITORY" "$TAG"
            printf 'sh install.sh --version %s\n```\n\n' "$version"
            printf 'Read `install.sh --help` for the options (built-in agent, agent role, channel).\n\n'
            cat CHANGELOG.md
          } >../notes.md
          # Alphas and betas (a tag with a suffix) are pre-releases; GitHub's
          # "latest" is always the newest stable release.
          case "$TAG" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          files=$(ls | grep -v '^CHANGELOG.md$')
          # No checkout in this job, so gh has no git repository to read the repository from: name it (#364).
          # shellcheck disable=SC2086
          gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file ../notes.md "$kind"

  # Signs latest.json with the identity of this workflow at the tag, the one
  # that signs checksums.txt, and puts it on the release. After a normal release
  # it runs once the release exists; in a refresh (refresh_only) it replaces the
  # file of the release the workflow was started on.
  publish-index:
    needs: [index, publish]
    if: ${{ !cancelled() && needs.index.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # upload the assets
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-index
          path: index
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Check, sign and upload latest.json
        working-directory: index
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # What the build job made must be what this run is for: the tag of
          # this run, issued now-ish and expiring within 90 days.
          jq -e --arg tag "$TAG" '
            .tag == $tag
            and (.issued_at | fromdateiso8601) > (now - 3600)
            and (.expires | fromdateiso8601) > now
            and ((.expires | fromdateiso8601) - (.issued_at | fromdateiso8601)) <= 90 * 86400
            and (.channels | type == "object")' latest.json >/dev/null
          cosign sign-blob --yes --new-bundle-format --bundle latest.json.sigstore.json latest.json
          gh release upload "$TAG" latest.json latest.json.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
