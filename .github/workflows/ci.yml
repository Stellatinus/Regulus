name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer run CI by hand (Actions tab, "Run workflow").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0
      - name: Every action is pinned to a commit
        run: sh scripts/pin-actions.sh --check
      - run: go vet ./...
      - name: go test -race ./...
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee go-test.log
      - name: Hub tests with one SQLite connection (catches nested database use, #219)
        run: make test-one-connection
      - name: Report failing tests
        if: failure()
        run: grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' go-test.log | head -40 | sed 's/^/::error::/' || true

  postgres:
    name: Go tests on PostgreSQL (${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 14 is the oldest supported version (Ubuntu 22.04), 16 the one in Ubuntu 24.04.
        pg: ["14", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: regulus
          POSTGRES_PASSWORD: regulus-ci
          POSTGRES_DB: regulus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulus -d regulus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The same tests as the Go job, with each test in a schema of its own.
      REGULUS_TEST_DATABASE_URL: postgres://regulus:regulus-ci@localhost:5432/regulus_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/storage/... ./internal/auth/... ./internal/fleet/... ./internal/hub/... ./internal/update/... ./cmd/...

  postgres-tls:
    name: Go tests on PostgreSQL with TLS (verify-full)
    runs-on: ubuntu-latest
    env:
      PGTLS_DIR: ${{ github.workspace }}/.pgtls
      # The certificate names localhost and nothing else (no IP address), so a
      # connection to 127.0.0.1 must be refused by verify-full.
      REGULUS_TEST_TLS_URL: postgres://regulus:regulus-ci@localhost:5432/regulus_test
      REGULUS_TEST_TLS_CA: ${{ github.workspace }}/.pgtls/ca.crt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Create a CA and a server certificate for localhost
        run: |
          mkdir -p "$PGTLS_DIR"
          cd "$PGTLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Regulus test CA" \
            -addext "basicConstraints=critical,CA:TRUE" -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out server.crt
          chmod 755 "$PGTLS_DIR"
          chmod 644 ca.crt server.crt
          # PostgreSQL refuses a key that is not 0600 and owned by its own user
          # (uid 999 in the official image).
          sudo chown 999:999 server.key
          sudo chmod 600 server.key
      - name: Start PostgreSQL 16 with TLS
        run: |
          docker run -d --name pgtls -p 5432:5432 \
            -e POSTGRES_USER=regulus -e POSTGRES_PASSWORD=regulus-ci -e POSTGRES_DB=regulus_test \
            -v "$PGTLS_DIR:/certs:ro" \
            postgres:16 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          # The image first runs a temporary server that listens on its socket
          # only, so ask over TCP to wait for the real one.
          for i in $(seq 1 30); do
            if docker exec pgtls pg_isready -h 127.0.0.1 -U regulus -d regulus_test; then exit 0; fi
            sleep 2
          done
          docker logs pgtls
          exit 1
      - name: Test verify-full
        run: |
          go test -race -count=1 -v -run 'TestPostgresVerifyFull' ./internal/storage/ | tee tls-test.log
          # A skipped test would pass without proving anything.
          if grep -q -e '--- SKIP' tls-test.log; then echo '::error::the TLS tests were skipped'; exit 1; fi
      - name: PostgreSQL log
        if: failure()
        run: docker logs pgtls

  release-config:
    name: Release configuration (goreleaser check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.12.0 # the version release.yml builds with
          args: check

  reproducible:
    name: Reproducible build (two builds, same hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the commit time and the changelog come from the history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.12.0 # the version release.yml builds with
          install-only: true
      - name: Build twice and compare
        run: scripts/check-reproducible.sh

  scripts:
    name: Scripts (install and release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh scripts/test-install.sh
      - run: sh scripts/test-next-version.sh
      - run: sh scripts/test-update-recover.sh

  dashboard:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make build
      - name: Smoke test
        run: make smoke

  e2e:
    name: End-to-end (hub and remote agent binaries over mTLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: make e2e
        env:
          # Lets the test of the previous release read the release list without
          # GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          make e2e 2>&1 | tee e2e.log
          # A skipped test would pass without proving anything. The one that
          # needs a published release to download may skip, with its reason (a
          # repository without releases, or GitHub not answering): it says so
          # in the log, and this prints it as a warning.
          if grep -e '--- SKIP' e2e.log | grep -v -e 'TestAgentOfAnOlderRelease' | grep -q .; then echo '::error::the end-to-end test was skipped'; exit 1; fi
          if grep -q -e '--- SKIP: TestAgentOfAnOlderRelease' e2e.log; then echo "::warning::the test of the previous release was skipped: $(grep -h -e 'no previous release' e2e.log | head -1)"; fi

  proto:
    name: Protobuf (generated code up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Only runs once the repository has a proto/ directory.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: hashFiles('proto/buf.yaml') != ''
        with:
          go-version-file: go.mod
      - run: make proto-check
        if: hashFiles('proto/buf.yaml') != ''
      # An older hub or agent must still read what this one sends
      # (docs/versioning.md): no field renumbered, retyped or removed compared
      # with the main branch. The checkout has no other branch, so buf reads
      # main from the repository itself.
      - name: Protobuf compatibility with main (buf breaking)
        if: hashFiles('proto/buf.yaml') != ''
        run: make proto-breaking PROTO_AGAINST='https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'
