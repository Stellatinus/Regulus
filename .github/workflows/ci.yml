name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer run CI by hand (Actions tab, "Run workflow").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is cancelled. A run on main never is: the
  # release workflow requires CI to have passed on the tagged commit (#207), and
  # a cancelled run is not a pass, so two merges close together could leave the
  # first commit impossible to release (#488).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides in seconds whether a pull request changes only documents, so the
  # jobs below skip what a document cannot break (#488). A push to main and a
  # manual run always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit of a pull request and its two parents
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            sh scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            echo docs_only=false | tee -a "$GITHUB_OUTPUT"
          fi

  # The one test that reads documents (a stale repository name in any text
  # file, #231): it runs for a documents-only change, where the Go jobs do not.
  docs:
    name: Documents (the tests that read them)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run 'TestNoStaleRepositoryName|TestInstallerUsesTheReleaseRepository' ./internal/update

  go-lint:
    name: Go lint and vet
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Every action is pinned to a commit
        run: sh scripts/pin-actions.sh --check
      - run: go vet ./...

  go-test:
    name: Go tests (race)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -race ./...
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee go-test.log
      - name: Report failing tests
        if: failure()
        run: grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' go-test.log | head -40 | sed 's/^/::error::/' || true

  # It used to be the last step of the Go job and took 1m16 of its 4m52 in
  # series; it does not depend on the other steps (#488).
  go-one-connection:
    name: Hub tests with one SQLite connection
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Hub tests with one SQLite connection (catches nested database use, #219)
        run: make test-one-connection

  # Keeps the name of the job that used to do all of this, so a required check
  # on "Go (lint, vet, test)" still works: it succeeds when the jobs above
  # succeeded or were skipped (a documents-only change), and fails otherwise.
  go:
    name: Go (lint, vet, test)
    needs: [changes, docs, go-lint, go-test, go-one-connection]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Go job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac

  postgres:
    name: Go tests on PostgreSQL (${{ matrix.pg }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 14 is the oldest supported version (Ubuntu 22.04), 16 the one in Ubuntu 24.04.
        pg: ["14", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: regulus
          POSTGRES_PASSWORD: regulus-ci
          POSTGRES_DB: regulus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulus -d regulus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The same tests as the Go job, with each test in a schema of its own.
      REGULUS_TEST_DATABASE_URL: postgres://regulus:regulus-ci@localhost:5432/regulus_test?sslmode=disable
    # A matrix job is not skipped at job level: a matrix job skipped before it is
    # expanded is reported with an unexpanded name, which a required check on its
    # name would wait for forever. A documents-only change skips its steps (#488).
    steps:
      - name: Nothing to test (documents only)
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "only documents changed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - if: needs.changes.outputs.docs_only != 'true'
        run: go test -race ./internal/storage/... ./internal/auth/... ./internal/fleet/... ./internal/hub/... ./internal/update/... ./cmd/...

  postgres-tls:
    name: Go tests on PostgreSQL with TLS (verify-full)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGTLS_DIR: ${{ github.workspace }}/.pgtls
      # The certificate names localhost and nothing else (no IP address), so a
      # connection to 127.0.0.1 must be refused by verify-full.
      REGULUS_TEST_TLS_URL: postgres://regulus:regulus-ci@localhost:5432/regulus_test
      REGULUS_TEST_TLS_CA: ${{ github.workspace }}/.pgtls/ca.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Create a CA and a server certificate for localhost
        run: |
          mkdir -p "$PGTLS_DIR"
          cd "$PGTLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Regulus test CA" \
            -addext "basicConstraints=critical,CA:TRUE" -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out server.crt
          chmod 755 "$PGTLS_DIR"
          chmod 644 ca.crt server.crt
          # PostgreSQL refuses a key that is not 0600 and owned by its own user
          # (uid 999 in the official image).
          sudo chown 999:999 server.key
          sudo chmod 600 server.key
      - name: Start PostgreSQL 16 with TLS
        run: |
          docker run -d --name pgtls -p 5432:5432 \
            -e POSTGRES_USER=regulus -e POSTGRES_PASSWORD=regulus-ci -e POSTGRES_DB=regulus_test \
            -v "$PGTLS_DIR:/certs:ro" \
            postgres:16 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          # The image first runs a temporary server that listens on its socket
          # only, so ask over TCP to wait for the real one.
          for i in $(seq 1 30); do
            if docker exec pgtls pg_isready -h 127.0.0.1 -U regulus -d regulus_test; then exit 0; fi
            sleep 2
          done
          docker logs pgtls
          exit 1
      - name: Test verify-full
        run: |
          go test -race -count=1 -v -run 'TestPostgresVerifyFull' ./internal/storage/ | tee tls-test.log
          # A skipped test would pass without proving anything.
          if grep -q -e '--- SKIP' tls-test.log; then echo '::error::the TLS tests were skipped'; exit 1; fi
      - name: PostgreSQL log
        if: failure()
        run: docker logs pgtls

  release-config:
    name: Release configuration (goreleaser check)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.12.0 # the version release.yml builds with
          args: check

  reproducible:
    name: Reproducible build (two builds, same hashes)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit time and the changelog come from the history
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.12.0 # the version release.yml builds with
          install-only: true
      - name: Build twice and compare
        run: scripts/check-reproducible.sh

  package:
    name: Package lifecycle (${{ matrix.image }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Steps are skipped, not the job: see the PostgreSQL matrix above (#488).
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Nothing to test (documents only)
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "only documents changed"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          version: v2.12.0 # the version release.yml builds with
          install-only: true
      - name: Build the packages (snapshot, nothing signed or published)
        if: needs.changes.outputs.docs_only != 'true'
        run: goreleaser release --snapshot --clean --skip=publish,sign,sbom,announce
      # Install, reinstall, upgrade, remove and purge the real .deb in a plain
      # container, and look at the user, the modes and the files (#400).
      - name: Install, upgrade, remove and purge the .deb
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          deb=$(ls dist/regulus_*_linux_amd64.deb)
          docker run --rm -v "$PWD":/src:ro "${{ matrix.image }}" \
            sh /src/scripts/test-package.sh "/src/$deb"

  scripts:
    name: Scripts (install and release)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/test-install.sh
      - run: sh scripts/test-next-version.sh
      - run: sh scripts/test-update-recover.sh
      - run: sh scripts/test-package-plugin.sh
      - run: sh scripts/test-ci-changes.sh

  dashboard:
    name: Dashboard (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    name: Build binary
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make build
      - name: Smoke test
        run: make smoke

  e2e:
    name: End-to-end (hub and remote agent binaries over mTLS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # For TestPreviousReleaseServesOnTheCurrentSchema on PostgreSQL (#383).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regulus
          POSTGRES_PASSWORD: regulus-ci
          POSTGRES_DB: regulus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulus -d regulus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: make e2e
        env:
          # Lets the test of the previous release read the release list without
          # GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          # Runs the previous release's program on a PostgreSQL database that
          # this source migrated (#383); each test run uses a schema of its own.
          REGULUS_TEST_DATABASE_URL: postgres://regulus:regulus-ci@localhost:5432/regulus_test?sslmode=disable
        run: |
          set -o pipefail
          make e2e 2>&1 | tee e2e.log
          # A skipped test would pass without proving anything. The one that
          # needs a published release to download may skip, with its reason (a
          # repository without releases, or GitHub not answering): it says so
          # in the log, and this prints it as a warning. The load test
          # (TestHubUnderRealLoad) runs only with REGULUS_LOAD=1, by hand.
          if grep -e '--- SKIP' e2e.log | grep -v -e 'TestAgentOfAnOlderRelease' -e 'TestPreviousReleaseServesOnTheCurrentSchema' -e 'TestUpdateOfAnOlderAgentOverMTLS' -e 'TestHubUnderRealLoad' | grep -q .; then echo '::error::the end-to-end test was skipped'; exit 1; fi
          if grep -q -e '--- SKIP: TestPreviousReleaseServesOnTheCurrentSchema' e2e.log; then echo "::warning::the test of the previous release on the current schema was skipped (or one of its databases): $(grep -h -e 'no previous release' -e 'to run this on PostgreSQL' e2e.log | head -1)"; fi
          if grep -q -e '--- SKIP: TestUpdateOfAnOlderAgentOverMTLS' e2e.log; then echo "::warning::the update of an older agent was skipped: $(grep -h -e 'only .* release is published' -e 'does not trust the identity' -e 'no releases to test with' -e 'rate limit: ' e2e.log | head -1)"; fi
          if grep -q -e '--- SKIP: TestAgentOfAnOlderRelease' e2e.log; then echo "::warning::the test of the previous release was skipped: $(grep -h -e 'no previous release' e2e.log | head -1)"; fi

  browser:
    name: Browser tests (dashboard in Chromium against the real hub)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Playwright is installed outside the dashboard project on purpose: it is
      # a test tool, and it keeps package.json and its lockfile free of a
      # browser downloader (#390).
      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright@1.63.0
          playwright install --with-deps chromium
      - name: make browser-test
        run: make browser-test
      # Screenshots, traces and the console of a failed scenario.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-artifacts
          path: browser-test-artifacts/
          if-no-files-found: ignore

  proto:
    name: Protobuf (generated code up to date)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only runs once the repository has a proto/ directory.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: hashFiles('proto/buf.yaml') != ''
        with:
          go-version-file: go.mod
      - run: make proto-check
        if: hashFiles('proto/buf.yaml') != ''
      # An older hub or agent must still read what this one sends
      # (docs/versioning.md): no field renumbered, retyped or removed compared
      # with the main branch. The checkout has no other branch, so buf reads
      # main from the repository itself.
      - name: Protobuf compatibility with main (buf breaking)
        if: hashFiles('proto/buf.yaml') != ''
        run: make proto-breaking PROTO_AGAINST='https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'

  # One check for the whole workflow: it fails if any job failed or was
  # cancelled, and passes when jobs were skipped on purpose (a documents-only
  # change). The maintainer can make this the single required check (#488).
  all-checks:
    name: All checks
    needs: [changes, docs, go-lint, go-test, go-one-connection, go, postgres, postgres-tls, release-config, reproducible, package, scripts, dashboard, build, e2e, browser, proto]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
