<title>Regulus Constellation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a console frame floating in deep space. Icon rail + top bar; the home is a full-bleed orbital
   "constellation" canvas (hub as the central star, agents on orbits by node type), a detail column on the
   right and a telemetry strip under the sky. Healthy servers are starlight; only problems get warm colours. */
:root{
  --void:#03050c; --deep:#080d1b; --glass:rgba(12,19,38,.78); --glass-2:rgba(22,33,64,.55);
  --line:rgba(148,178,255,.13); --line-2:rgba(148,178,255,.28);
  --fg:#e4ecff; --muted:#8693b6; --dim:#58648a;
  --star:#cfe0ff; --ion:#79a6ff; --leo:#e8c27c;
  --ok:#5fe0b5; --warn:#ffb547; --crit:#ff5f7e; --off:#5a6482;
  --f-display:"Syncopate","Eurostile","Arial Black",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#0d1530 0%,transparent 60%),var(--void);color:var(--fg);
  font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--leo);border:1px solid rgba(232,194,124,.35);padding:1px 6px;border-radius:99px;white-space:nowrap;text-transform:none}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);gap:10px}
.rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}
.brand{width:42px;height:42px;display:grid;place-items:center;margin-bottom:10px}
.nav{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted);position:relative}
.nav svg{width:20px;height:20px}
.nav:hover{color:var(--fg);background:var(--glass-2)}
.nav[aria-current="page"]{color:var(--star);background:rgba(121,166,255,.12);border-color:rgba(121,166,255,.35);box-shadow:0 0 18px rgba(121,166,255,.25) inset}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-11px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--ion);box-shadow:0 0 8px var(--ion)}
.nav[disabled]{opacity:.35;cursor:not-allowed}
.nav .tip{position:absolute;left:54px;white-space:nowrap;background:var(--deep);border:1px solid var(--line-2);padding:4px 8px;border-radius:8px;font-size:12px;color:var(--fg);opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s;z-index:30}
.nav:hover .tip,.nav:focus-visible .tip{opacity:1;transform:none}
.rail .sp{flex:1}

.top{display:flex;align-items:center;gap:14px;padding:0 10px 0 16px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.32em;color:var(--star);white-space:nowrap}
.wordmark small{display:block;font-family:var(--f-mono);font-weight:400;font-size:9px;letter-spacing:.18em;color:var(--dim);margin-top:1px}
.chips{display:flex;gap:8px;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(5,9,20,.5);white-space:nowrap;font-size:12.5px}
.chip b{font-weight:500}
.chip .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip .term{font-family:var(--f-mono);color:var(--leo)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px currentColor;color:var(--ok);flex:none}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;min-width:0;width:290px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(5,9,20,.55);color:var(--muted);font-size:12.5px}
.search span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 9px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:rgba(121,166,255,.16);color:var(--star)}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

main{min-height:0;min-width:0;position:relative}
.view{height:100%;min-height:0}

/* ---------- constellation view ---------- */
#v-constellation{display:grid;grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage detail" "tele detail";gap:10px}
.stage{grid-area:stage;position:relative;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#02040a}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#sky.dragging{cursor:grabbing}
.hud{position:absolute;pointer-events:none;z-index:2}
.hud-tl{top:16px;left:18px}
.hud-tl h1{text-transform:uppercase;margin:4px 0 2px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.2em;color:var(--star);text-shadow:0 0 22px rgba(121,166,255,.45)}
.hud-tl p{margin:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.hud-tl p b{color:var(--fg);font-weight:500}
.hud-tr{top:14px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.layers{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:rgba(4,8,18,.7);backdrop-filter:blur(6px)}
.layers label{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
.layers input{position:absolute;opacity:0;pointer-events:none}
.layers label::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid var(--dim)}
.layers label:has(input:checked){color:var(--fg);background:rgba(121,166,255,.12)}
.layers label:has(input:checked)::before{background:var(--ion);border-color:var(--ion);box-shadow:0 0 6px var(--ion)}
.layers label:has(input:focus-visible){outline:2px solid var(--ion)}
.example{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.hud-bl{left:14px;bottom:14px;pointer-events:auto;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 300px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:rgba(4,8,18,.7);backdrop-filter:blur(6px);font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend svg{width:13px;height:13px}
.legend .sw{width:8px;height:8px;border-radius:50%}
.hud-br{right:14px;bottom:14px;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:10px;border:1px solid var(--line-2);background:rgba(10,16,34,.8);font-size:12.5px;font-weight:500;color:var(--fg);transition:.15s}
.btn:hover{border-color:var(--ion);box-shadow:0 0 16px rgba(121,166,255,.25)}
.btn.gold{border-color:rgba(232,194,124,.5);color:var(--leo)}
.btn.gold:hover{border-color:var(--leo);box-shadow:0 0 18px rgba(232,194,124,.25)}
.btn.danger{border-color:rgba(255,95,126,.45);color:var(--crit)}
.btn.primary{background:linear-gradient(180deg,rgba(121,166,255,.3),rgba(121,166,255,.12));border-color:rgba(121,166,255,.6);color:var(--star)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.note{font-family:var(--f-mono);font-size:10px;color:var(--dim);text-align:right}
.zoomctl{display:flex;gap:4px}
.zoomctl button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(4,8,18,.7);color:var(--muted);font-family:var(--f-mono)}
.zoomctl button:hover{color:var(--fg);border-color:var(--line-2)}
#tip{position:absolute;z-index:5;pointer-events:none;min-width:170px;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:rgba(6,11,24,.92);backdrop-filter:blur(8px);font-size:12px;transform:translate(14px,14px)}
#tip .n{font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--fg)}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-family:var(--f-mono);font-size:11px}
#tip .r b{color:var(--fg);font-weight:400}
.banner{position:absolute;left:50%;top:190px;transform:translateX(-50%);z-index:3;padding:8px 16px;border-radius:99px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;border:1px solid rgba(255,95,126,.5);color:var(--crit);background:rgba(40,6,16,.75);box-shadow:0 0 30px rgba(255,95,126,.25);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.banner.gold{border-color:rgba(232,194,124,.55);color:var(--leo);background:rgba(36,26,6,.75);box-shadow:0 0 30px rgba(232,194,124,.2)}

/* ---------- detail ---------- */
.detail{grid-area:detail;min-height:0;overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.d-head{display:flex;flex-direction:column;gap:6px;position:relative}
.d-head .eyebrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.d-head .eyebrow svg{width:14px;height:14px}
.d-name{margin:2px 0 0;font-family:var(--f-mono);font-weight:500;font-size:22px;letter-spacing:-.01em;word-break:break-all}
.d-name input{width:100%;background:rgba(5,9,20,.7);border:1px solid var(--ion);border-radius:8px;padding:3px 8px;font:inherit}
.d-sub{color:var(--muted);font-size:11.5px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border-radius:99px;font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.s-online{color:var(--ok)} .s-stale{color:var(--warn)} .s-offline{color:var(--off)} .s-revoked{color:var(--crit)}
.d-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;padding:10px 11px 8px;background:rgba(4,8,18,.45)}
.metric .v{font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.1;margin-top:3px}
.metric .v small{font-size:12px;color:var(--muted);font-weight:400}
.metric canvas{display:block;width:100%;height:38px;margin-top:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:12.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:12px;text-align:right;min-width:0;overflow-wrap:anywhere}
.sec h3{margin:0 0 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.disk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:12px;margin-bottom:8px}
.disk .p{font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disk .pc{font-family:var(--f-mono);color:var(--muted)}
.bar{grid-column:1/3;height:5px;border-radius:5px;background:rgba(148,178,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ion),var(--star))}
.bar i.w{background:linear-gradient(90deg,#d98a2b,var(--warn))}
.bar i.c{background:linear-gradient(90deg,#c43a5a,var(--crit))}
.mgr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:4px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.mgr:first-of-type{border-top:0}
.mgr .be{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mgr .st{width:8px;height:8px;border-radius:50%}
.apps{display:flex;flex-wrap:wrap;gap:6px}
.app-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(4,8,18,.45);font-size:12px}
.app-chip i{width:6px;height:6px;border-radius:2px;background:var(--ion)}
.muted{color:var(--muted)}
.fp{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px dashed var(--line-2);min-width:0}
.fp span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp button{background:none;border:0;color:var(--ion);font-size:11px;padding:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.confirm{border:1px solid rgba(255,95,126,.4);background:rgba(40,6,16,.5);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- telemetry ---------- */
.tele{grid-area:tele;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--deep);padding:11px 14px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:21px;font-weight:500;line-height:1.15;white-space:nowrap}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400}
.kpi .s{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi canvas{width:100%;height:26px;display:block;margin-top:auto}
.seg{display:flex;gap:2px;height:6px;margin-top:auto}
.seg i{flex:1;border-radius:2px;background:var(--star);opacity:.85}
.logbox{background:var(--deep);padding:10px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.logbox .eyebrow{display:flex;justify-content:space-between}
#log{list-style:none;margin:0;padding:0;height:78px;overflow:hidden;display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:11px;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
#log li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;white-space:nowrap;animation:logIn .4s ease-out}
#log li span:last-child{overflow:hidden;text-overflow:ellipsis}
#log time{color:var(--dim)}
#log .lv{width:6px;height:6px;border-radius:50%;margin-top:5px}
@keyframes logIn{from{opacity:0;transform:translateY(-4px)}}

/* ---------- servers view ---------- */
.panel{height:100%;overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{text-transform:uppercase;margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.18em;color:var(--star)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:none;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{color:var(--star);border-color:rgba(121,166,255,.5);background:rgba(121,166,255,.1)}
.fchip b{font-family:var(--f-mono);font-weight:400;color:var(--dim)}
.tfind{margin-left:auto;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(5,9,20,.6);min-width:0;width:240px;max-width:100%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}
th{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(4,8,18,.5);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:rgba(121,166,255,.06)}
tbody tr:last-child td{border-bottom:0}
td .nm{display:flex;align-items:center;gap:9px;font-family:var(--f-mono)}
td svg.g{width:14px;height:14px;flex:none}
td canvas{width:96px;height:22px;display:block}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.minibar{display:inline-block;width:56px;height:4px;border-radius:4px;background:rgba(148,178,255,.12);vertical-align:middle;margin-right:8px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--ion)}

/* ---------- updates view ---------- */
.ugrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:14px;background:rgba(4,8,18,.45);padding:16px}
.card h2{margin:0 0 10px;font-size:13px;font-weight:600}
.verline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--f-mono)}
.ver{font-size:26px;font-weight:500}
.ver.new{color:var(--leo);text-shadow:0 0 18px rgba(232,194,124,.35)}
.arrow{color:var(--dim)}
.segctl{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.segctl button{background:none;border:0;padding:6px 12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
.segctl button:first-child{border-left:0}
.segctl button[aria-pressed="true"]{background:rgba(121,166,255,.16);color:var(--star)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.waves{display:flex;flex-direction:column;gap:10px}
.wave{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(4,8,18,.35)}
.wave.active{border-color:rgba(121,166,255,.55);box-shadow:0 0 22px rgba(121,166,255,.12) inset}
.wave.failed{border-color:rgba(255,95,126,.5)}
.wave .wl{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.wave .wl b{display:block;font-size:18px;color:var(--fg);font-weight:500;letter-spacing:0;text-transform:none}
.uchips{display:flex;flex-wrap:wrap;gap:6px}
.uchip{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:9px;border:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;background:rgba(8,13,27,.7)}
.uchip .ic{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.uchip.run .ic{background:none;border:2px solid var(--ion);border-right-color:transparent;animation:spin .8s linear infinite}
.uchip.done{border-color:rgba(95,224,181,.35)} .uchip.done .ic{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.uchip.fail{border-color:rgba(255,95,126,.5);color:var(--crit)} .uchip.fail .ic{background:var(--crit)}
.uchip.skip{opacity:.45}
.uchip em{font-style:normal;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:12.5px;border:1px solid var(--line)}
.msg.err{border-color:rgba(255,95,126,.45);background:rgba(40,6,16,.45)}
.msg.ok{border-color:rgba(95,224,181,.4);background:rgba(6,36,26,.4)}
.compat{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.compat .k{font-family:var(--f-mono);color:var(--leo)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,4,10,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.palette,.modal{width:min(560px,100%);background:var(--deep);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(121,166,255,.12);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 18px;font-size:15px;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px}
.palette li svg{width:14px;height:14px;flex:none}
.palette li .h{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.palette li[aria-selected="true"]{background:rgba(121,166,255,.14)}
.modal{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.modal h2{text-transform:uppercase;margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.14em;color:var(--star)}
.modal p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.code{font-family:var(--f-mono);font-size:12px;background:#02040a;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;color:var(--star)}
.code .c{color:var(--dim)} .code .y{color:var(--leo)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  #v-constellation{grid-template-columns:minmax(0,1fr) 310px}
  .tele{grid-template-columns:repeat(4,minmax(0,1fr))}
  .logbox{grid-column:1/-1}
  .search{width:200px}
}
@media (max-width:960px){
  body{overflow:auto;height:auto}
  html{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .rail{grid-row:auto;flex-direction:row;justify-content:center;padding:6px;order:2}
  .rail .brand,.rail .sp{display:none}
  .nav .tip{display:none}
  .nav[aria-current="page"]::before{left:12px;right:12px;top:auto;bottom:-7px;width:auto;height:2px}
  .top{order:1;flex-wrap:wrap;padding:10px 12px;gap:10px}
  .top .chips{order:3;width:100%;overflow-x:auto}
  .top .sp,.clock{display:none}
  .search{width:auto;flex:1}
  main{order:3}
  #v-constellation{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "tele" "detail"}
  .stage{height:min(78vh,620px);min-height:440px}
  .detail{overflow:visible}
  .tele{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{height:auto;padding:18px 16px}
  .ugrid{grid-template-columns:minmax(0,1fr)}
  .wave{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .hud-tl h1{font-size:17px}
  .legend{display:none}
  .layers label{padding:4px 6px;font-size:11px}
  .hud-tr{left:14px;align-items:stretch}

  .hud-tl p,.hud-tr .example{display:none}

  .wordmark small{display:none}
}

function proj(r,deg,y=0){

}

  else if(type==='dev'){for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r*1.15,y+Math.sin(a)*r*1.15)}ctx.closePath()}
  else if(type==='ai'){for(let i=0;i<8;i++){const a=-Math.PI/2+i*TAU/8,rr=i%2?r*.45:r*1.5;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}

}

function frame(ms){

  // background
  ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);
  if(neb)ctx.drawImage(neb,0,0,W,H);

    const a=(.25+.75*s.z)*(REDUCE?.8:.6+.4*Math.sin(T*1.3*s.z+s.ph));

  screen.clear();

    const bob=Math.sin(T*.6+n.bob)*.012;

  }

    }

    const c=proj(ringRadius(n.rPos)*.5,n.aPos,lift);

    const flick=hubDown?(.25+.25*Math.sin(T*18+n.bob*7)):1;

      for(let i=0;i<k;i++){

        for(let j=0;j<4;j++){const q=bez(p,c,center,Math.max(0,tt-j*.012));ctx.fillStyle=`rgba(${col},${(.9-j*.22)*Math.sin(tt*Math.PI)})`;ctx.beginPath();ctx.arc(q.x,q.y,(1.6-j*.3)*Math.max(.7,p.s),0,TAU);ctx.fill()}

    if(L.hb&&age<.9&&!hubDown){const q=bez(p,c,center,age/.9);const gg=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,9);gg.addColorStop(0,'rgba(255,240,210,.95)');gg.addColorStop(1,'rgba(232,194,124,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(q.x,q.y,9,0,TAU);ctx.fill()}
  }
  // replication link hub -> redundant hub
  const sb=NODES.find(n=>n.type==='standby'&&n.status==='online');
  if(sb&&foPhase==='idle'){
    const p=screen.get(sb.id);
    ctx.strokeStyle='rgba(232,194,124,.35)';ctx.lineWidth=1;ctx.setLineDash([1,4]);
    for(const o of[-2.5,2.5]){ctx.beginPath();ctx.moveTo(center.x+o,center.y);ctx.lineTo(p.x+o,p.y);ctx.stroke()}
    ctx.setLineDash([]);

function ringRadius(rp){ // interpolate between ring fractions

let evI=0,evNext=0;
function tick(){
  const T=nowS();
  for(const n of NODES){
    if(n.status==='online'||n.status==='stale'){
      n.cpu=clamp(n.cpu+(Math.random()-.5)*7+(n.base.cpu-n.cpu)*.12,1,99);
      n.mem=clamp(n.mem+(Math.random()-.5)*1.6+(n.base.mem-n.mem)*.08,1,99);
      n.net=Math.max(.5,n.net+(Math.random()-.5)*n.base.net*.2+(n.base.net-n.net)*.15);n.rx=n.net*.72;n.tx=n.net*.28;
      n.hist.cpu.push(n.cpu);n.hist.cpu.shift();n.hist.mem.push(n.mem);n.hist.mem.shift();
    }
    // heartbeats every 15 s (stale ones miss them)
    if(n.status==='online'&&foPhase!=='lost'&&n.type!=='hub'){if(T-n.lastHb>=15){n.lastHb=T-(Math.random()*.3);n.rip.push(T);n.pkt=T;hubFlash=1;if(n.rip.length>3)n.rip.shift()}}
    if(n.type==='hub'&&foPhase!=='lost')n.lastHb=T;
  }
  const live=NODES.filter(n=>n.status==='online'||n.status==='stale');
  const avg=k=>live.reduce((s,n)=>s+n[k],0)/Math.max(1,live.length);
  fleet.cpu.push(avg('cpu'));fleet.mem.push(live.reduce((s,n)=>s+n.mem/100*n.memTotal,0));fleet.net.push(live.reduce((s,n)=>s+n.net,0));
  for(const k in fleet)if(fleet[k].length>60)fleet[k].shift();
  if(T>evNext&&foPhase==='idle'){const [l,m]=EV[evI++%EV.length]();log(l,m);evNext=T+3+Math.random()*4}
  updateTele();updateDetailLive();if(currentView==='servers')updateRowsLive();

/* ================= failover simulation (design preview of epic #103) ================= */
function startFailover(){
  if(foPhase!=='idle')return;
  foFrom=NODES.find(n=>n.type==='hub');foTo=NODES.find(n=>n.type==='standby');
  if(!foTo||foTo.status!=='online')return;
  foPhase='lost';foT=performance.now()/1000;
  foFrom.status='offline';foFrom.lastSeen=nowS();
  $('#failover').disabled=true;renderDetail();
  showBanner(t('hub_lost',{n:foFrom.name}),false);
  $('#hubdot').style.cssText='background:var(--crit);color:var(--crit)';
  log('crit',LANG==='it'?`${foFrom.name}: nessun heartbeat dal hub attivo`:`${foFrom.name}: no heartbeat from the active hub`);
  setTimeout(()=>log('warn',LANG==='it'?`${foTo.name}: il hub attivo non risponde da 45 s · avvio la promozione`:`${foTo.name}: active hub silent for 45 s · starting promotion`),900);
}
function stepFailover(T){
  if(foPhase==='lost'&&T-foT>2.8){foPhase='promote';foT=T;term++;foTo.term=term;
    showBanner(t('promoting',{n:foTo.name,t:term}),true);$('#termchip').textContent=term;
    log('gold',LANG==='it'?`termine ${term}: ${foTo.name} è il nuovo hub attivo`:`term ${term}: ${foTo.name} is the new active hub`);
    foFrom._a=foTo.aPos;}
  if(foPhase==='promote'){
    const k=Math.min(1,(T-foT)/2.4),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    foTo.rPos=1-e;foFrom.rPos=e;foFrom.aPos=foFrom._a;
    if(k>=1){
      foPhase='idle';foTo.type='hub';foTo.ring=0;foFrom.type='standby';foFrom.ring=1;foTo.rPos=0;foFrom.rPos=1;
      $('#hubname').textContent=foTo.name;$('#hubdot').style.cssText='';hideBanner();
      log('info',LANG==='it'?'gli agenti si ricollegano al nuovo hub attivo (stessa CA, impronta invariata)':'agents reconnect to the new active hub (same CA, same fingerprint)');
      NODES.forEach(n=>{if(n.status==='online')n.lastHb=nowS()-Math.random()*14});
      const back=foFrom;
      setTimeout(()=>{back.status='online';back.lastHb=nowS();log('ok',LANG==='it'?`${back.name} è tornato: ora è hub ridondante (#110)`:`${back.name} is back: now a redundant hub (#110)`);$('#failover').disabled=false;renderFailoverLabel();renderDetail()},3500);
      renderDetail();
    }
  }
}

function drawSpark(c,arr,color,max,fill=true){
  const r=c.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);
  if(c.width!==Math.round(r.width*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);
  const w=r.width,h=r.height,n=arr.length,mx=max||Math.max(...arr)*1.15||1,mn=0;
  const X=i=>i/(n-1)*(w-4)+1, Y=v=>h-2-(v-mn)/(mx-mn)*(h-5);
  g.strokeStyle='rgba(148,178,255,.08)';g.lineWidth=1;for(const f of[.5]){g.beginPath();g.moveTo(0,h*f);g.lineTo(w,h*f);g.stroke()}
  g.beginPath();arr.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));
  if(fill){const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,color.replace('1)','.28)'));gr.addColorStop(1,color.replace('1)','0)'));g.save();g.lineTo(X(n-1),h);g.lineTo(X(0),h);g.closePath();g.fillStyle=gr;g.fill();g.restore();
    g.beginPath();arr.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)))}
  g.strokeStyle=color;g.lineWidth=1.4;g.stroke();
  g.fillStyle=color;g.beginPath();g.arc(X(n-1),Y(arr[n-1]),2.4,0,TAU);g.fill();
}
function counts(){const c={online:0,stale:0,offline:0,revoked:0};NODES.forEach(n=>c[n.status]++);return c}

  ${detailMode==='revoke'?`<div class="confirm"><span>${t('revoke_q',{n:n.name})}</span><div><button class="btn danger" id="doRevoke">${t('revoke_go')}</button><button class="btn" id="cancelX">${t('cancel')}</button></div></div>`:
   detailMode==='rename'?`<div class="actions"><button class="btn primary" id="saveRename">${t('save')}</button><button class="btn" id="cancelX">${t('cancel')}</button></div>`:
   `<div class="actions"><button class="btn" id="renameBtn">${t('rename')}</button>${n.type==='hub'||n.status==='revoked'?'':`<button class="btn danger" id="revokeBtn">${t('revoke')}</button>`}</div>`}
  `;
  const on=(id,f)=>{const b=document.getElementById(id);if(b)b.onclick=f};
  on('renameBtn',()=>{detailMode='rename';renderDetail();const i=$('#renameIn');i.focus();i.select()});
  on('revokeBtn',()=>{detailMode='revoke';renderDetail()});
  on('cancelX',()=>{detailMode=null;renderDetail()});
  on('saveRename',saveRename);
  const ri=$('#renameIn');if(ri)ri.onkeydown=e=>{if(e.key==='Enter')saveRename();if(e.key==='Escape'){detailMode=null;renderDetail()}};
  on('doRevoke',()=>{n.status='revoked';n.lastSeen=nowS();n.cpu=0;n.mem=0;log('crit',LANG==='it'?`${n.name} revocato: connessione chiusa dal hub`:`${n.name} revoked: the hub closed its connection`);detailMode=null;renderDetail();updateTele();if(currentView==='servers')renderRows()});
  on('copyFp',e=>copyText(n.fp,e.target));
  updateDetailLive();
}
function saveRename(){const n=byId(selected),v=$('#renameIn').value.trim();if(v&&v!==n.name){log('info',`${n.name} → ${v}`);n.name=v}detailMode=null;renderDetail();if(currentView==='servers')renderRows()}
function updateDetailLive(){
  const n=byId(selected);if(!n)return;
  const c=$('#d-cpu');if(c){c.innerHTML=`${Math.round(n.cpu)}<small> %</small>`;$('#d-mem').innerHTML=`${(n.mem/100*n.memTotal).toFixed(1)}<small> GiB</small>`;
    drawSpark($('#d-cpu-c'),n.hist.cpu,n.cpu>85?'rgba(255,95,126,1)':'rgba(121,166,255,1)',100);drawSpark($('#d-mem-c'),n.hist.mem,'rgba(207,224,255,1)',100)}
  const l=$('#d-last');if(l)l.textContent=rel(nowS()-lastContact(n))+(n.status==='online'?' · ♥ 15 s':'');
  const nt=$('#d-net');if(nt)nt.textContent=`${rate(n.rx)} / ${rate(n.tx)}`;
}
function copyText(s,btn){const done=()=>{const o=btn.textContent;btn.textContent=t('copied');setTimeout(()=>btn.textContent=o,1400)};
  try{navigator.clipboard.writeText(s).then(done,()=>selectFallback(btn))}catch(e){selectFallback(btn)}}
function selectFallback(btn){const sp=btn.parentElement.querySelector('span')||btn.closest('.modal')?.querySelector('.code');if(!sp)return;const r=document.createRange();r.selectNodeContents(sp);const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* ================= servers view ================= */
let filter='all',query='';
function renderFilters(){
  const c=counts();const items=[['all',t('all'),NODES.length],['online',t('online'),c.online],['stale',t('stale'),c.stale],['offline',t('offline'),c.offline],['revoked',t('revoked'),c.revoked]];
  $('#filters').innerHTML=items.map(([k,l,v])=>`<button class="fchip" data-f="${k}" aria-pressed="${filter===k}">${k==='all'?'':`<i class="dot" style="background:${pillColorVar[k]};color:${pillColorVar[k]};width:6px;height:6px"></i>`}${l}<b>${v}</b></button>`).join('')+`<input class="tfind" id="tfind" placeholder="${t('find')}" value="${query.replace(/"/g,'&quot;')}" aria-label="${t('find')}">`;
  $$('#filters .fchip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();renderRows()});
  $('#tfind').oninput=e=>{query=e.target.value;renderRows()};
}
function renderRows(){
  const rows=NODES.filter(n=>(filter==='all'||n.status===filter)&&n.name.toLowerCase().includes(query.toLowerCase()));
  $('#rows').innerHTML=rows.map(n=>{const live=n.status==='online'||n.status==='stale';return `<tr data-id="${n.id}" tabindex="0">
    <td><span class="nm">${glyphSVG(n.type,n.type==='hub'||n.type==='standby'?'#e8c27c':statusColor[n.status])}${n.name}</span></td>
    <td>${typeName(n.type)}${TYPES[n.type].impl?'':` <span class="tag">${TYPES[n.type].issue}</span>`}</td>
    <td><span class="pill s-${n.status}"><i></i>${t(n.status)}</span></td>
    <td>${n.os} <span class="muted mono">${n.arch}</span></td>
    <td class="num">v${n.ver}</td>
    <td>${live?`<canvas data-sp="${n.id}"></canvas>`:'<span class="muted">—</span>'}</td>
    <td class="num">${live?`<span class="minibar"><i style="width:${n.mem}%"></i></span>${Math.round(n.mem)}%`:'—'}</td>
    <td class="num muted" data-last="${n.id}">${rel(nowS()-lastContact(n))}</td></tr>`}).join('');
  $$('#rows tr').forEach(tr=>{const go=()=>{select(tr.dataset.id);setView('constellation')};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});
  updateRowsLive();
}
function updateRowsLive(){
  $$('#rows canvas[data-sp]').forEach(c=>{const n=byId(c.dataset.sp);drawSpark(c,n.hist.cpu.slice(-30),n.cpu>85?'rgba(255,95,126,1)':'rgba(121,166,255,1)',100,false)});
  $$('#rows [data-last]').forEach(td=>{td.textContent=rel(nowS()-lastContact(byId(td.dataset.last)))});
}

/* ================= updates view ================= */
let channel='beta',waveSize='3',roll=null;
const VERS={stable:'0.4.2',beta:'0.5.0',alpha:'0.6.0-alpha.2'};
function upTargets(){return NODES.filter(n=>n.type!=='hub'&&n.status!=='revoked')}
function renderUpdates(){
  $$('#channel button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ch===channel));
  $$('#wavesize button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.w===waveSize);if(b.dataset.w==='all')b.textContent=t('wave_all')});
  $('#newver').textContent=VERS[channel];
  const sb=$('#startRollout');sb.textContent=roll&&roll.running?t('running'):t('start');sb.disabled=!!(roll&&roll.running)||channel==='stable';
  $('#compat').innerHTML=`<span class="k">0.4 · N</span><span>${t('compat_n')}</span><span class="k">0.3 · N-1</span><span>${t('compat_n1')}</span><span class="k" style="color:var(--warn)">≤ 0.2</span><span>${t('compat_old')} · ai-spica v0.2.7</span>`;
  const list=upTargets();const size=waveSize==='all'?list.length:+waveSize;const waves=[];
  for(let i=0;i<list.length;i+=size)waves.push(list.slice(i,i+size));
  $('#waves').innerHTML=waves.map((w,i)=>{const st=roll?roll.waveState[i]:'';return `<div class="wave ${st==='active'?'active':''} ${st==='failed'?'failed':''}">
    <div class="wl">${t('wave')}<b>${i+1} / ${waves.length}</b></div>
    <div class="uchips">${w.map(n=>{const s=roll?roll.state[n.id]||'':'';const off=n.status==='offline';return `<span class="uchip ${s} ${off?'skip':''}"><i class="ic"></i>${n.name}<em>${s==='done'?VERS[channel]:'v'+n.ver}</em></span>`}).join('')}</div></div>`}).join('');
  $('#rolloutMsg').innerHTML=roll&&roll.msg?`<div class="msg ${roll.fail?'err':'ok'}">${roll.msg}</div>`:'';
}
$('#channel').onclick=e=>{const b=e.target.closest('button');if(!b||roll&&roll.running)return;channel=b.dataset.ch;roll=null;renderUpdates()};
$('#wavesize').onclick=e=>{const b=e.target.closest('button');if(!b||roll&&roll.running)return;waveSize=b.dataset.w;roll=null;renderUpdates()};
$('#resetRollout').onclick=()=>{if(roll&&roll.running)return;roll=null;renderUpdates()};
$('#startRollout').onclick=async()=>{
  const list=upTargets();const size=waveSize==='all'?list.length:+waveSize;const waves=[];for(let i=0;i<list.length;i+=size)waves.push(list.slice(i,i+size));
  roll={running:true,state:{},waveState:{},msg:''};renderUpdates();
  log('gold',LANG==='it'?`rollout ${VERS[channel]} avviato · ondate da ${waveSize==='all'?t('wave_all'):waveSize}`:`rollout ${VERS[channel]} started · waves of ${waveSize}`);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  for(let i=0;i<waves.length;i++){
    roll.waveState[i]='active';
    waves[i].forEach(n=>{if(n.status!=='offline')roll.state[n.id]='run'});renderUpdates();
    await wait(1600+Math.random()*600);
    let failed=null;
    for(const n of waves[i]){if(n.status==='offline')continue;if(n.name==='pi-mira'){roll.state[n.id]='fail';failed=n}else{roll.state[n.id]='done'}}
    if(failed){roll.waveState[i]='failed';roll.fail=true;roll.msg=t('roll_fail',{n:failed.name});roll.running=false;renderUpdates();log('crit',(LANG==='it'?'rollout fermato: ':'rollout stopped: ')+failed.name);return}
    roll.waveState[i]='done';renderUpdates();await wait(500);
  }
  roll.running=false;roll.msg=t('roll_ok',{v:VERS[channel]});renderUpdates();
};

/* ================= views, palette, enrollment ================= */
let currentView='constellation';
function setView(v){
  if(!['constellation','servers','updates'].includes(v))v='constellation';
  currentView=v;$$('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  $$('.nav[data-view]').forEach(b=>b.toggleAttribute('aria-current',b.dataset.view===v)||b.dataset.view===v&&b.setAttribute('aria-current','page'));
  $$('.nav[data-view]').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);
  if(v==='servers'){renderFilters();renderRows()}
  if(v==='updates')renderUpdates();
  if(v==='constellation')requestAnimationFrame(()=>{resize();updateTele();updateDetailLive()});
}
$$('.nav[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
addEventListener('hashchange',()=>setView(location.hash.slice(1)));

const pOv=$('#paletteOv'),pIn=$('#pIn'),pList=$('#pList');let pSel=0,pItems=[];
function openPalette(){pOv.hidden=false;pIn.value='';pIn.placeholder=t('search');renderPalette();pIn.focus()}
function closePalette(){pOv.hidden=true}
function renderPalette(){
  const q=pIn.value.toLowerCase();
  const acts=[
    {l:t('nav_constellation'),h:t('cmd_go'),g:'hub',f:()=>setView('constellation')},
    {l:t('nav_servers'),h:t('cmd_go'),g:'compute',f:()=>setView('servers')},
    {l:t('nav_updates'),h:t('cmd_go'),g:'backup',f:()=>setView('updates')},
    {l:t('add_server'),h:t('cmd_action'),g:'gateway',f:openEnroll},
    {l:t('failover'),h:t('cmd_action'),g:'standby',f:()=>{setView('constellation');startFailover()}},
  ];
  const nodes=NODES.map(n=>({l:n.name,h:typeName(n.type),g:n.type,c:statusColor[n.status],f:()=>{select(n.id);setView('constellation')}}));
  pItems=[...nodes,...acts].filter(i=>i.l.toLowerCase().includes(q)||i.h.toLowerCase().includes(q)).slice(0,12);pSel=Math.min(pSel,Math.max(0,pItems.length-1));
  pList.innerHTML=pItems.map((i,k)=>`<li role="option" aria-selected="${k===pSel}" data-k="${k}">${glyphSVG(i.g,i.c||'#79a6ff')}<span>${i.l}</span><span class="h">${i.h}</span></li>`).join('');
  $$('#pList li').forEach(li=>{li.onclick=()=>{const it=pItems[+li.dataset.k];closePalette();it.f()};li.onmousemove=()=>{if(pSel!==+li.dataset.k){pSel=+li.dataset.k;renderPalette()}}});
}
pIn.oninput=()=>{pSel=0;renderPalette()};
pIn.onkeydown=e=>{if(e.key==='ArrowDown'){pSel=Math.min(pItems.length-1,pSel+1);renderPalette();e.preventDefault()}else if(e.key==='ArrowUp'){pSel=Math.max(0,pSel-1);renderPalette();e.preventDefault()}else if(e.key==='Enter'&&pItems[pSel]){const it=pItems[pSel];closePalette();it.f()}else if(e.key==='Escape')closePalette()};
pOv.onclick=e=>{if(e.target===pOv)closePalette()};
$('#openPalette').onclick=openPalette;
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pOv.hidden?openPalette():closePalette()}else if(e.key==='Escape'){closePalette();closeEnroll()}else if(e.key==='/'&&document.activeElement===document.body){e.preventDefault();openPalette()}});

const eOv=$('#enrollOv');
function openEnroll(){
  const tok=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
  const fp=byId('local').fp.slice(0,7+24)+'…';
  $('#enrollCode').innerHTML=`<span class="c"># ${LANG==='it'?'sul nuovo server':'on the new server'}</span>\nregulus agent \\\n  --hub <span class="y">hub.home-lab.lan:8443</span> \\\n  --token <span class="y">${tok}</span> \\\n  --ca-fingerprint <span class="y">${fp}</span> \\\n  --data-dir /var/lib/regulus-agent`;
  $('#enrollExp').textContent=t('enroll_exp');eOv.hidden=false;$('#closeEnroll').focus();
  log('info',LANG==='it'?'token di registrazione creato · scade tra 60 min':'enrollment token created · expires in 60 min');
}
function closeEnroll(){eOv.hidden=true}
$('#addServer').onclick=openEnroll;$('#closeEnroll').onclick=closeEnroll;eOv.onclick=e=>{if(e.target===eOv)closeEnroll()};
$('#copyEnroll').onclick=e=>copyText($('#enrollCode').textContent.replace(/^#.*\n/,''),e.target);

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang=LANG;
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
  $('#legend').innerHTML=Object.keys(TYPES).map(k=>`<span>${glyphSVG(k,k==='hub'||k==='standby'?'#e8c27c':'#cfe0ff')}${typeName(k)}</span>`).join('')+
    `<span><i class="sw" style="background:var(--warn)"></i>${t('stale')}</span><span><i class="sw" style="background:var(--off)"></i>${t('offline')}</span><span><i class="sw" style="background:var(--crit)"></i>${t('revoked')}</span><span class="mono" style="color:var(--dim)">${t('drag')}</span>`;
  renderFailoverLabel();renderDetail();updateTele();
  if(currentView==='servers'){renderFilters();renderRows()}if(currentView==='updates')renderUpdates();
}
$$('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;store.set('rg-lang',LANG);applyLang()});

/* ================= boot ================= */
resize();applyLang();setView(location.hash.slice(1)||'constellation');
log('ok',LANG==='it'?'regulus-hub avviato · 14 agenti collegati (mTLS)':'regulus-hub started · 14 agents connected (mTLS)');
tick();setInterval(tick,1000);requestAnimationFrame(frame);
})();
</script>
