version: 2

project_name: regulus

before:
  hooks:
    # The dashboard is embedded in the binary, so it must be built first.
    - make dashboard

builds:
  - id: regulus
    main: ./cmd/regulus
    binary: regulus
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The time of the commit, not of the build, so that two builds of a tag
    # give the same bytes (#215).
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: regulus
    formats: [tar.gz]
    name_template: "regulus_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Files added to the archive carry the commit time too (#215).
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: regulus
    package_name: regulus
    vendor: CodexCircle
    homepage: https://github.com/Stellatinus/Regulus
    maintainer: CodexCircle <noreply@codexcircle.invalid>
    description: CodexCircle Server Manager (Regulus)
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    # Ubuntu Server is the reference platform. The package runs the hub as the
    # unprivileged system user "regulus"; see packaging/ and docs/installation.md.
    contents:
      - src: packaging/regulus.service
        dst: /usr/lib/systemd/system/regulus.service
      - src: packaging/regulus-agent.service
        dst: /usr/lib/systemd/system/regulus-agent.service
      - src: packaging/regulus-update.path
        dst: /usr/lib/systemd/system/regulus-update.path
      - src: packaging/regulus-update.service
        dst: /usr/lib/systemd/system/regulus-update.service
      - src: packaging/regulus-plugin-apply.path
        dst: /usr/lib/systemd/system/regulus-plugin-apply.path
      - src: packaging/regulus-plugin-apply.service
        dst: /usr/lib/systemd/system/regulus-plugin-apply.service
      - src: packaging/regulus-agent-update.path
        dst: /usr/lib/systemd/system/regulus-agent-update.path
      - src: packaging/regulus-agent-update.service
        dst: /usr/lib/systemd/system/regulus-agent-update.service
      - src: packaging/regulus-update-recover.service
        dst: /usr/lib/systemd/system/regulus-update-recover.service
      - src: packaging/regulus-update-confirm.service
        dst: /usr/lib/systemd/system/regulus-update-confirm.service
      # Settles an interrupted update when the machine starts; a shell script
      # so that it works when /usr/bin/regulus itself cannot run.
      - src: packaging/update-recover.sh
        dst: /usr/lib/regulus/update-recover
        file_info:
          mode: 0755
      - src: packaging/config.yaml
        dst: /etc/regulus/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: regulus
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    overrides:
      deb:
        dependencies: [adduser]
      # %pre uses useradd and groupadd (#398).
      rpm:
        dependencies: [shadow-utils]

checksum:
  name_template: checksums.txt
  # The installer is signed together with the packages.
  extra_files:
    - glob: packaging/install.sh

# Keyless signature (Sigstore) of the checksums file, made with the GitHub
# Actions identity of the release workflow. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity 'https://github.com/Stellatinus/Regulus/.github/workflows/release.yml@refs/tags/vX.Y.Z' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      # The hub verifies this file in-process and reads the Sigstore bundle
      # format; cosign 2 writes an older layout unless asked.
      - --new-bundle-format
      - --bundle=${signature}
      - ${artifact}

sboms:
  - artifacts: archive

release:
  # Published so that .../releases/latest/download/install.sh always works.
  extra_files:
    - glob: packaging/install.sh
  # Tags with a suffix (v1.2.0-beta.1, v1.2.0-alpha.1) are published as
  # pre-releases; GitHub's "latest" is always the newest stable release.
  prerelease: auto
  header: |
    Install this version on Ubuntu Server 22.04 or newer:

    ```sh
    curl -fsSLO https://github.com/Stellatinus/Regulus/releases/download/{{ .Tag }}/install.sh
    sh install.sh --version {{ .Version }}
    ```

    Read `install.sh --help` for the options (built-in agent, agent role, channel).

# In git log order (newest first), short hashes, grouped by Conventional
# Commit type.
changelog:
  sort: ""
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^build\\(deps"
      - "^Merge "
      - "^Initial commit$"
